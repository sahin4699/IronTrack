<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IronTrack Pro" />
    <title>IronTrack - Anatomi & Beslenme Pro</title>

    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #121316;
            --card-border: #1f2229;
            --accent: #ff6b00;
            --accent-hover: #ff8533;
            --accent-glow: rgba(255, 107, 0, 0.45);
            --gold: #ffa502;
            --text: #f5f6fa;
            --muted: #8a8f9d;
            --protein: #2ed573;
            --carb: #1e90ff;
            --fat: #ffa502;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
            padding-left: calc(env(safe-area-inset-left, 0px) + 14px);
            padding-right: calc(env(safe-area-inset-right, 0px) + 14px);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 620px;
            margin: 0 auto;
        }

        /* Üst Bar & Hamburger Buton */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(145deg, #16181d, #0d0e11);
            border: 1px solid #282c35;
            border-radius: 18px;
            padding: 14px 18px;
            margin-bottom: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            background: #1c1f26;
            border: 1px solid #2b303c;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .menu-btn span {
            width: 20px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transition: 0.2s;
        }

        .brand-title h1 {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .brand-title h1 span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        /* SOL AÇILIR MENÜ (DRAWER) */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -330px;
            width: 320px;
            max-width: 85vw;
            height: 100vh;
            background: #0f1013;
            border-right: 1px solid var(--card-border);
            z-index: 1001;
            padding: 20px 16px;
            overflow-y: auto;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .drawer-overlay.open .drawer {
            transform: translateX(330px);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 16px;
        }

        .drawer-header h3 {
            font-size: 16px;
            color: var(--accent);
            font-weight: 800;
            text-transform: uppercase;
        }

        .close-drawer {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 24px;
            cursor: pointer;
        }

        /* Kalori Sayacı (FatSecret Stili) */
        .calorie-gauge {
            background: #14161c;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            margin-bottom: 16px;
        }

        .cal-num {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
        }

        .cal-num span {
            font-size: 14px;
            color: var(--accent);
        }

        .progress-bar {
            height: 8px;
            background: #232732;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--gold));
            width: 0%;
            transition: width 0.3s;
        }

        .macro-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .m-pill {
            padding: 4px 8px;
            border-radius: 6px;
            background: #1c1f26;
        }

        .food-search-box {
            position: relative;
            margin-bottom: 12px;
        }

        .food-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .food-item {
            background: #14171d;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .food-item:hover {
            border-color: var(--accent);
        }

        .food-item .fname {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .food-item .fcal {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .add-food-btn {
            background: #232732;
            border: none;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        /* GERÇEKÇİ MEDİKAL ANATOMİ ALANI */
        .anatomy-viewport {
            background: radial-gradient(circle at center, #191c24 0%, #0c0d10 100%);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px 10px;
            margin-bottom: 14px;
            text-align: center;
            perspective: 1000px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            cursor: pointer;
        }

        .flip-body {
            width: 250px;
            height: 380px;
            margin: 0 auto;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .flip-body.flipped {
            transform: rotateY(180deg);
        }

        .body-side {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .body-side.back {
            transform: rotateY(180deg);
        }

        .med-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: contrast(1.15) brightness(0.88) drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
            pointer-events: none;
        }

        /* İnteraktif Kas Tıklama Bölgeleri */
        .muscle-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .hotspot {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 107, 0, 0.4);
            background: rgba(255, 107, 0, 0.15);
            cursor: pointer;
            transition: all 0.2s;
            animation: pulseDot 2.2s infinite ease-in-out;
        }

        .hotspot:hover,
        .hotspot.active {
            background: rgba(255, 107, 0, 0.65);
            border-color: #fff;
            box-shadow: 0 0 18px var(--accent);
            transform: scale(1.15);
        }

        @keyframes pulseDot {
            0% {
                transform: scale(1);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0.7;
            }
        }

        /* Hotspot Koordinatları (Ön) */
        .hs-chest {
            top: 22%;
            left: 34%;
            width: 80px;
            height: 40px;
            border-radius: 12px;
        }

        .hs-shoulders-l {
            top: 18%;
            left: 18%;
            width: 34px;
            height: 34px;
        }

        .hs-shoulders-r {
            top: 18%;
            left: 68%;
            width: 34px;
            height: 34px;
        }

        .hs-biceps-l {
            top: 31%;
            left: 16%;
            width: 30px;
            height: 44px;
            border-radius: 12px;
        }

        .hs-biceps-r {
            top: 31%;
            left: 72%;
            width: 30px;
            height: 44px;
            border-radius: 12px;
        }

        .hs-abs {
            top: 35%;
            left: 40%;
            width: 50px;
            height: 60px;
            border-radius: 10px;
        }

        .hs-quads-l {
            top: 54%;
            left: 28%;
            width: 42px;
            height: 75px;
            border-radius: 14px;
        }

        .hs-quads-r {
            top: 54%;
            left: 54%;
            width: 42px;
            height: 75px;
            border-radius: 14px;
        }

        /* Hotspot Koordinatları (Arka) */
        .hs-traps {
            top: 14%;
            left: 38%;
            width: 60px;
            height: 40px;
            border-radius: 10px;
        }

        .hs-lats {
            top: 28%;
            left: 33%;
            width: 85px;
            height: 50px;
            border-radius: 14px;
        }

        .hs-triceps-l {
            top: 28%;
            left: 16%;
            width: 30px;
            height: 45px;
            border-radius: 12px;
        }

        .hs-triceps-r {
            top: 28%;
            left: 72%;
            width: 30px;
            height: 45px;
            border-radius: 12px;
        }

        .hs-hams-l {
            top: 56%;
            left: 29%;
            width: 40px;
            height: 65px;
            border-radius: 14px;
        }

        .hs-hams-r {
            top: 56%;
            left: 54%;
            width: 40px;
            height: 65px;
            border-radius: 14px;
        }

        .hs-calves-l {
            top: 76%;
            left: 28%;
            width: 35px;
            height: 55px;
            border-radius: 14px;
        }

        .hs-calves-r {
            top: 76%;
            left: 56%;
            width: 35px;
            height: 55px;
            border-radius: 14px;
        }

        .flip-hint {
            font-size: 11px;
            color: var(--muted);
            margin-top: 10px;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        /* Egzersiz Listesi & Box */
        .box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .box h2 {
            font-size: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .exercise-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .ex-card {
            background: #090a0d;
            border: 1px solid #232732;
            border-radius: 10px;
            padding: 11px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ex-card:hover,
        .ex-card:active {
            border-color: var(--accent);
            background: #14171f;
        }

        .ex-card .title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .ex-card .meta {
            font-size: 11px;
            color: var(--accent);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* Form */
        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .full-row {
            grid-column: span 2;
        }

        input {
            width: 100%;
            background: #090a0d;
            border: 1px solid #232732;
            border-radius: 10px;
            padding: 13px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button.btn-primary {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        /* Video Modal */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .modal-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0c0d10;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent);
        }
    </style>
</head>

<body>

    <!-- SOL AÇILIR MENÜ (FATSECRET KALORİ & BESLENME) -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer(event)">
        <div class="drawer" onclick="event.stopPropagation()">
            <div class="drawer-header">
                <h3>🥗 KALORİ & BESLENME</h3>
                <button class="close-drawer" onclick="toggleDrawer()">&times;</button>
            </div>

            <!-- Günlük Hedef Özeti -->
            <div class="calorie-gauge">
                <div style="font-size:11px; color:var(--muted); font-weight:700;">GÜNLÜK KALORİ TAKİBİ</div>
                <div class="cal-num"><span id="consumedCal">0</span> / 2500 <span>KCAL</span></div>

                <div class="progress-bar">
                    <div class="progress-fill" id="calProgress"></div>
                </div>

                <div class="macro-row">
                    <div class="m-pill" style="color:var(--protein);">P: <span id="protVal">0</span>g</div>
                    <div class="m-pill" style="color:var(--carb);">K: <span id="carbVal">0</span>g</div>
                    <div class="m-pill" style="color:var(--fat);">Y: <span id="fatVal">0</span>g</div>
                </div>
            </div>

            <!-- Hızlı Yemek Ekleme Havuzu -->
            <div
                style="font-size:12px; font-weight:800; color:var(--muted); margin-bottom:8px; text-transform:uppercase;">
                Fit Besin Kütüphanesi
            </div>

            <div class="food-list" id="foodList"></div>

            <div style="margin-top:auto; padding-top:16px;">
                <button class="btn-primary" style="background:#232732; color:#fff;" onclick="resetCalories()">Günü
                    Sıfırla</button>
            </div>
        </div>
    </div>

    <!-- ANA İÇERİK -->
    <div class="container">

        <!-- Üst Bar -->
        <div class="top-nav">
            <div class="nav-left">
                <div class="menu-btn" onclick="toggleDrawer()">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="brand-title">
                    <h1>IRON<span>TRACK</span></h1>
                </div>
            </div>
            <div style="font-size:12px; font-weight:700; color:var(--accent);" id="navCalSummary">
                0 / 2500 KCAL
            </div>
        </div>

        <!-- GERÇEKÇİ MEDİKAL ANATOMİ VE ÇEVİRME -->
        <div class="anatomy-viewport" onclick="flipBody(event)">
            <div class="flip-body" id="bodyCard">

                <!-- ÖN GÖRÜNÜM -->
                <div class="body-side front">
                    <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=500&auto=format&fit=crop&q=60"
                        alt="Ön Anatomi" class="med-img"
                        style="border-radius:14px; opacity:0.85; filter: contrast(1.3) grayscale(0.6) brightness(0.7);" />

                    <div class="muscle-layer">
                        <div class="hotspot hs-chest active" onclick="selectMuscle('chest', event)" title="Göğüs"></div>
                        <div class="hotspot hs-shoulders-l" onclick="selectMuscle('shoulders', event)" title="Sol Omuz">
                        </div>
                        <div class="hotspot hs-shoulders-r" onclick="selectMuscle('shoulders', event)" title="Sağ Omuz">
                        </div>
                        <div class="hotspot hs-biceps-l" onclick="selectMuscle('biceps', event)" title="Sol Biceps">
                        </div>
                        <div class="hotspot hs-biceps-r" onclick="selectMuscle('biceps', event)" title="Sağ Biceps">
                        </div>
                        <div class="hotspot hs-abs" onclick="selectMuscle('abs', event)" title="Karın"></div>
                        <div class="hotspot hs-quads-l" onclick="selectMuscle('quads', event)" title="Ön Bacak"></div>
                        <div class="hotspot hs-quads-r" onclick="selectMuscle('quads', event)" title="Ön Bacak"></div>
                    </div>
                </div>

                <!-- ARKA GÖRÜNÜM -->
                <div class="body-side back">
                    <img src="https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=500&auto=format&fit=crop&q=60"
                        alt="Arka Anatomi" class="med-img"
                        style="border-radius:14px; opacity:0.85; filter: contrast(1.3) grayscale(0.6) brightness(0.7);" />

                    <div class="muscle-layer">
                        <div class="hotspot hs-traps" onclick="selectMuscle('traps', event)" title="Trapez"></div>
                        <div class="hotspot hs-lats" onclick="selectMuscle('lats', event)" title="Kanat & Sırt"></div>
                        <div class="hotspot hs-triceps-l" onclick="selectMuscle('triceps', event)" title="Sol Triceps">
                        </div>
                        <div class="hotspot hs-triceps-r" onclick="selectMuscle('triceps', event)" title="Sağ Triceps">
                        </div>
                        <div class="hotspot hs-hams-l" onclick="selectMuscle('hamstrings', event)" title="Arka Bacak">
                        </div>
                        <div class="hotspot hs-hams-r" onclick="selectMuscle('hamstrings', event)" title="Arka Bacak">
                        </div>
                        <div class="hotspot hs-calves-l" onclick="selectMuscle('calves', event)" title="Kalf"></div>
                        <div class="hotspot hs-calves-r" onclick="selectMuscle('calves', event)" title="Kalf"></div>
                    </div>
                </div>

            </div>
            <div class="flip-hint">🔄 Vücudu çevirmek için boş alana dokun</div>
        </div>

        <!-- Seçilen Kasın Hareketleri -->
        <div class="box">
            <h2 id="muscleTitle">🎯 GÖĞÜS (CHEST) HAREKETLERİ</h2>
            <div class="exercise-grid" id="exerciseGrid"></div>
        </div>

        <!-- Set Giriş Formu -->
        <div class="box">
            <h2>➕ Seti Listeye Bas</h2>
            <form id="workoutForm" class="grid-form">
                <div class="full-row">
                    <input type="text" id="exerciseName" placeholder="Seçilen Egzersiz" required />
                </div>
                <div>
                    <input type="number" id="weight" placeholder="Ağırlık (kg)" step="0.5" inputmode="decimal"
                        required />
                </div>
                <div>
                    <input type="number" id="reps" placeholder="Tekrar" inputmode="numeric" required />
                </div>
                <div class="full-row">
                    <input type="number" id="setNumber" placeholder="Set No" value="1" inputmode="numeric" required />
                </div>
                <div class="full-row">
                    <button type="submit" class="btn-primary">Seti Kaydet</button>
                </div>
            </form>
        </div>

        <!-- Antrenman Kayıtları -->
        <div class="box">
            <h2>📋 Antrenman Kayıtları</h2>
            <div id="logsList">Yükleniyor...</div>
        </div>

    </div>

    <!-- Video Modal -->
    <div class="video-modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-header">
                <strong id="modalTitle" style="color:var(--accent);">Form Videosu</strong>
                <button onclick="closeModal()"
                    style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer;">&times;</button>
            </div>
            <div class="video-wrapper">
                <iframe id="videoFrame" src="" allowfullscreen></iframe>
            </div>
            <div style="padding:12px;">
                <button class="btn-primary" onclick="useExerciseFromModal()">Bu Hareketi Antrenmana Seç</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/WorkoutLogs';

        /* 1. SOL DRAWER & KALORİ SAYACI MOTORU */
        const foods = [
            { name: "Izgara Tavuk Göğsü (150g)", cal: 247, p: 46, c: 0, f: 5 },
            { name: "Pirinç Pilavı (200g)", cal: 260, p: 5, c: 57, f: 1 },
            { name: "Yulaf Ezmesi & Muz (80g)", cal: 310, p: 10, c: 58, f: 5 },
            { name: "Haşlanmış Yumurta (3 Adet)", cal: 215, p: 18, c: 1, f: 15 },
            { name: "Izgara Köfte (160g)", cal: 340, p: 30, c: 4, f: 22 },
            { name: "Whey Protein Shake (1 Ölçek)", cal: 120, p: 24, c: 2, f: 1.5 },
            { name: "Lor Peyniri (100g)", cal: 98, p: 12, c: 3, f: 4 }
        ];

        let nutrition = JSON.parse(localStorage.getItem('ironNutrition')) || { cal: 0, p: 0, c: 0, f: 0 };

        function toggleDrawer() {
            document.getElementById('drawerOverlay').classList.toggle('open');
        }

        function closeDrawer(e) {
            if (e.target.id === 'drawerOverlay') toggleDrawer();
        }

        function renderFoods() {
            const list = document.getElementById('foodList');
            list.innerHTML = '';
            foods.forEach((f, idx) => {
                const item = document.createElement('div');
                item.className = 'food-item';
                item.innerHTML = `
                    <div>
                        <div class="fname">${f.name}</div>
                        <div class="fcal">${f.cal} kcal &bull; P: ${f.p}g | K: ${f.c}g | Y: ${f.f}g</div>
                    </div>
                    <button class="add-food-btn" onclick="addFood(${idx})">+ Ekle</button>
                `;
                list.appendChild(item);
            });
            updateNutritionUI();
        }

        function addFood(idx) {
            const f = foods[idx];
            nutrition.cal += f.cal;
            nutrition.p += f.p;
            nutrition.c += f.c;
            nutrition.f += f.f;
            localStorage.setItem('ironNutrition', JSON.stringify(nutrition));
            updateNutritionUI();
        }

        function resetCalories() {
            nutrition = { cal: 0, p: 0, c: 0, f: 0 };
            localStorage.setItem('ironNutrition', JSON.stringify(nutrition));
            updateNutritionUI();
        }

        function updateNutritionUI() {
            document.getElementById('consumedCal').innerText = nutrition.cal;
            document.getElementById('protVal').innerText = nutrition.p;
            document.getElementById('carbVal').innerText = nutrition.c;
            document.getElementById('fatVal').innerText = nutrition.f;

            const pct = Math.min(100, Math.round((nutrition.cal / 2500) * 100));
            document.getElementById('calProgress').style.width = pct + '%';
            document.getElementById('navCalSummary').innerText = `${nutrition.cal} / 2500 KCAL`;
        }

        /* 2. GERÇEKÇİ ANATOMİ & 3D ÇEVİRME */
        let isFlipped = false;
        function flipBody(e) {
            // Eğer hotspot'a tıklandıysa çevirme yapma
            if (e.target.classList.contains('hotspot')) return;
            const body = document.getElementById('bodyCard');
            isFlipped = !isFlipped;
            if (isFlipped) body.classList.add('flipped');
            else body.classList.remove('flipped');
        }

        const muscleExercises = {
            chest: {
                title: "🎯 GÖĞÜS (CHEST)",
                exercises: [
                    { name: "Barbell Bench Press", videoId: "rT7DgCr-3pg", meta: "Bileşik • Güç" },
                    { name: "Incline Dumbbell Press", videoId: "8iPEnn-ltC8", meta: "Üst Göğüs" },
                    { name: "Cable Fly", videoId: "Z57CtFmRMxA", meta: "İzolasyon" },
                    { name: "Dips", videoId: "2z8JmcrW-As", meta: "Alt Göğüs" }
                ]
            },
            shoulders: {
                title: "🎯 OMUZ (DELTOIDS)",
                exercises: [
                    { name: "Overhead Barbell Press", videoId: "2yjwXTZQDDI", meta: "Güç" },
                    { name: "Lateral Raise", videoId: "3VcKaXpzqRo", meta: "Yan Omuz" },
                    { name: "Face Pull", videoId: "rep-qVOkqgk", meta: "Arka Omuz" }
                ]
            },
            biceps: {
                title: "🎯 BICEPS (KOL)",
                exercises: [
                    { name: "Barbell Biceps Curl", videoId: "ykJmrZ5v0Oo", meta: "Kütle" },
                    { name: "Incline Curl", videoId: "soxrZlIl35U", meta: "Uzun Baş" },
                    { name: "Hammer Curl", videoId: "zC3nLlEvin4", meta: "Brachialis" }
                ]
            },
            triceps: {
                title: "🎯 TRICEPS (ARKA KOL)",
                exercises: [
                    { name: "Triceps Pushdown", videoId: "vB5OHsJ3EME", meta: "İzolasyon" },
                    { name: "Skull Crusher", videoId: "d_KZxkH_toI", meta: "Kütle" }
                ]
            },
            abs: {
                title: "🎯 KARIN (CORE)",
                exercises: [
                    { name: "Hanging Leg Raise", videoId: "hdng3Nm1x_E", meta: "Alt Karın" },
                    { name: "Cable Crunch", videoId: "pZapRXZcggU", meta: "Üst Karın" }
                ]
            },
            quads: {
                title: "🎯 ÖN BACAK (QUADRICEPS)",
                exercises: [
                    { name: "Barbell Back Squat", videoId: "bEv6CCg2BC8", meta: "Bileşik • Güç" },
                    { name: "Leg Press", videoId: "IZxyjW7MPJQ", meta: "Hacim" }
                ]
            },
            lats: {
                title: "🎯 KANAT & SIRT (LATS)",
                exercises: [
                    { name: "Barbell Bent-Over Row", videoId: "9efgc2TrvEg", meta: "Kalınlık" },
                    { name: "Lat Pulldown", videoId: "CAwf7n6Luuc", meta: "Genişlik" },
                    { name: "Deadlift", videoId: "op9kVnSso6Q", meta: "Tüm Sırt" }
                ]
            },
            traps: {
                title: "🎯 TRAPEZ",
                exercises: [
                    { name: "Barbell Shrug", videoId: "g6qbq4Du13Q", meta: "Trapez" }
                ]
            },
            hamstrings: {
                title: "🎯 ARKA BACAK (HAMSTRINGS)",

                    { name: "Romanian Deadlift", videoId: "JCXUYuzwNrM", meta: "Gerilim" },
                    { name: "Lying Leg Curl", videoId: "ELOCsoDSmrg", meta: "İzolasyon" }
                ]
            },
            calves: {
                title: "🎯 BALDIR (CALVES)",
                exercises: [
                    { name: "Standing Calf Raise", videoId: "-M4-G8p8fmc", meta: "Kalf" }
                ]
            }
        };

        function selectMuscle(key, event) {
            if (event) event.stopPropagation();
            document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('active'));
            if (event) event.target.classList.add('active');

            const data = muscleExercises[key];
            if (!data) return;
            document.getElementById('muscleTitle').innerText = data.title;

            const grid = document.getElementById('exerciseGrid');
            grid.innerHTML = '';
            data.exercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'ex-card';
                card.innerHTML = `
                    <div class="title">${ex.name}</div>
                    <div class="meta"><span>${ex.meta}</span><span>▶ Video</span></div>
                `;
                card.onclick = () => openVideo(ex.name, ex.videoId);
                grid.appendChild(card);
            });
        }

        let selectedExName = "";
        function openVideo(name, videoId) {
            selectedExName = name;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1`;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('videoFrame').src = '';
            document.getElementById('videoModal').style.display = 'none';
        }

        function useExerciseFromModal() {
            document.getElementById('exerciseName').value = selectedExName;
            closeModal();
            window.scrollTo({ top: document.getElementById('workoutForm').offsetTop - 20, behavior: 'smooth' });
        }

        /* 3. SET VE ANTRENMAN LOGLARI */
        async function loadLogs() {
            const container = document.getElementById('logsList');
            try {
                const res = await fetch(API_URL);
                const logs = await res.json();
                container.innerHTML = '';
                if (logs.length === 0) {
                    container.innerHTML = '<p style="color:var(--muted); font-size:13px; text-align:center;">Henüz set kaydedilmedi.</p>';
                    return;
                }
                logs.forEach(log => {
                    const item = document.createElement('div');
                    item.className = 'log-item';
                    item.innerHTML = `
                        <div>
                            <strong>${log.exerciseName}</strong> &bull; Set ${log.setNumber}
                            <div style="color:var(--accent); font-size:12px; font-weight:700;">${log.weight} KG &times; ${log.reps} Tekrar</div>
                        </div>
                        <button style="background:#1f1113; color:#ff4757; border:none; padding:6px 12px; border-radius:6px; font-weight:700;" onclick="deleteLog(${log.id})">Sil</button>
                    `;
                    container.appendChild(item);
                });
            } catch (e) {
                container.innerHTML = '<p style="color:var(--muted); font-size:13px; text-align:center;">Kayıtlar listelenmeye hazır.</p>';
            }
        }

        document.getElementById('workoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const setInput = document.getElementById('setNumber');
            const cSet = parseInt(setInput.value) || 1;
            const payload = {
                exerciseName: document.getElementById('exerciseName').value,
                weight: parseFloat(document.getElementById('weight').value),
                reps: parseInt(document.getElementById('reps').value),
                setNumber: cSet
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('weight').value = '';
            document.getElementById('reps').value = '';
            setInput.value = cSet + 1;
            loadLogs();
        });

        async function deleteLog(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            loadLogs();
        }

        window.onload = () => {
            renderFoods();
            selectMuscle('chest');
            loadLogs();
        };
    </script>
</body>
