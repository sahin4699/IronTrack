<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IronTrack" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>IronTrack Pro - Gym Tracker</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #121316;
            --card-border: #1f2229;
            --accent: #ff6b00;
            --accent-hover: #ff8533;
            --accent-glow: rgba(255, 107, 0, 0.4);
            --gold: #ffa502;
            --text: #f5f6fa;
            --muted: #8a8f9d;
            --success: #2ed573;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
            padding-left: calc(env(safe-area-inset-left, 0px) + 14px);
            padding-right: calc(env(safe-area-inset-right, 0px) + 14px);
            min-height: 100vh;
            user-select: none;
        }

        .container {
            max-width: 620px;
            margin: 0 auto;
        }

        /* Hero */
        .hero {
            background: linear-gradient(145deg, #16181d, #0d0e11);
            border: 1px solid #282c35;
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            margin-bottom: 14px;
        }

        .hero-text h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .hero-text h1 span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .hero-text p {
            color: var(--muted);
            font-size: 11px;
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .animation-box {
            width: 90px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .barbell {
            animation: benchPress 1.8s ease-in-out infinite alternate;
        }

        .arms {
            animation: armPush 1.8s ease-in-out infinite alternate;
            transform-origin: 65px 70px;
        }

        @keyframes benchPress {
            0% {
                transform: translateY(0px);
            }

            100% {
                transform: translateY(22px);
            }
        }

        @keyframes armPush {
            0% {
                transform: scaleY(1);
            }

            100% {
                transform: scaleY(0.7);
            }
        }

        /* Program Seçim Sekmeleri (PPL) */
        .split-tabs {
            display: flex;
            background: #121316;
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 14px;
            gap: 4px;
        }

        .split-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 13px;
            font-weight: 700;
            border-radius: 9px;
            cursor: pointer;
            color: var(--muted);
            transition: all 0.2s;
        }

        .split-tab.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        /* Dashboard Özet Sayaçları */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 16px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .stat-card .val {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            margin-top: 4px;
        }

        .stat-card .val span {
            color: var(--accent);
            font-size: 13px;
        }

        /* Rest Timer Floating Bar */
        .timer-card {
            background: #14171d;
            border: 1px solid #282d38;
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .timer-display {
            font-size: 22px;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .timer-actions {
            display: flex;
            gap: 6px;
        }

        .timer-btn {
            background: #232732;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .timer-btn:active {
            background: var(--accent);
            color: #000;
        }

        /* Standart Kutular */
        .box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .box h2 {
            font-size: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Quick Tags */
        .quick-tags {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .quick-tags::-webkit-scrollbar {
            display: none;
        }

        .tag {
            background: #191b22;
            border: 1px solid #282d38;
            padding: 7px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            color: #b0b5c0;
            white-space: nowrap;
        }

        .tag:active {
            background: var(--accent);
            color: #000;
        }

        /* Form & Canlı 1RM */
        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .full-row {
            grid-column: span 2;
        }

        input {
            width: 100%;
            background: #090a0d;
            border: 1px solid #232732;
            border-radius: 10px;
            padding: 13px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .live-preview {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            padding: 4px 6px;
            font-weight: 600;
        }

        .live-preview span {
            color: var(--accent);
            font-weight: 700;
        }

        button.btn-primary {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        button.btn-primary:active {
            transform: scale(0.98);
        }

        /* PR Card */
        .pr-card {
            display: none;
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 107, 0, 0.08);
            border: 1px dashed var(--accent);
            color: var(--accent);
            text-align: center;
            font-size: 13px;
            font-weight: 700;
        }

        /* Set Listesi */
        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0c0d10;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent);
        }

        .log-item strong {
            font-size: 14px;
            color: #fff;
        }

        .log-item .details {
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            margin-top: 3px;
        }

        .del-btn {
            background: #1f1113;
            color: #ff4757;
            border: 1px solid #3d1b1f;
            padding: 7px 12px;
            border-radius: 7px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="hero">
            <div class="hero-text">
                <h1>IRON<span>TRACK</span></h1>
                <p>Hardcore Antrenman & Set Takibi</p>
            </div>

            <div class="animation-box">
                <svg viewBox="0 0 130 100" width="100%" height="100%">
                    <rect x="25" y="72" width="80" height="8" rx="3" fill="#2d3436" />
                    <rect x="35" y="80" width="6" height="15" fill="#14171a" />
                    <rect x="89" y="80" width="6" height="15" fill="#14171a" />
                    <rect x="40" y="66" width="50" height="7" rx="3" fill="#ff6b00" />
                    <circle cx="34" cy="69" r="6" fill="#dfe6e9" />
                    <g class="arms">
                        <line x1="55" y1="67" x2="65" y2="40" stroke="#f1f2f6" stroke-width="4"
                            stroke-linecap="round" />
                        <line x1="75" y1="67" x2="65" y2="40" stroke="#f1f2f6" stroke-width="4"
                            stroke-linecap="round" />
                    </g>
                    <g class="barbell">
                        <line x1="15" y1="40" x2="115" y2="40" stroke="#ced6e0" stroke-width="3"
                            stroke-linecap="round" />
                        <rect x="22" y="24" width="6" height="32" rx="2" fill="#ff6b00" />
                        <rect x="29" y="28" width="4" height="24" rx="2" fill="#cc5500" />
                        <rect x="102" y="24" width="6" height="32" rx="2" fill="#ff6b00" />
                        <rect x="97" y="28" width="4" height="24" rx="2" fill="#cc5500" />
                    </g>
                </svg>
            </div>
        </div>

        <!-- PPL Gün Seçimi -->
        <div class="split-tabs">
            <div class="split-tab active" onclick="setProgram('push', this)">🔥 PUSH (İTİŞ)</div>
            <div class="split-tab" onclick="setProgram('pull', this)">⚡ PULL (ÇEKİŞ)</div>
            <div class="split-tab" onclick="setProgram('legs', this)">💥 LEGS (BACAK)</div>
        </div>

        <!-- Antrenman Özet Sayaçları -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Toplam Hacim</div>
                <div class="val" id="totalVolume">0 <span>KG</span></div>
            </div>
            <div class="stat-card">
                <div class="label">Tamamlanan Set</div>
                <div class="val" id="totalSets">0 <span>SET</span></div>
            </div>
        </div>

        <!-- Dinlenme Kronometresi -->
        <div class="timer-card">
            <div>
                <div style="font-size:11px; color:var(--muted); font-weight:700;">DİNLENME SAYACI</div>
                <div class="timer-display" id="timer">01:30</div>
            </div>
            <div class="timer-actions">
                <button class="timer-btn" onclick="startTimer()">Başlat</button>
                <button class="timer-btn" onclick="addTimer(30)">+30s</button>
                <button class="timer-btn" onclick="resetTimer()">Sıfırla</button>
            </div>
        </div>

        <!-- PR Sorgulama -->
        <div class="box">
            <h2>🏆 Kişisel Rekor (PR)</h2>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="prInput" placeholder="Hareket (Örn: Bench Press)" />
                <button type="button" class="btn-primary" style="width: 100px; padding:0;"
                    onclick="checkPR()">Sorgula</button>
            </div>
            <div id="prResult" class="pr-card"></div>
        </div>

        <!-- Set Giriş Formu -->
        <div class="box">
            <h2>➕ Yeni Set Ekle</h2>

            <div class="quick-tags" id="quickTags"></div>

            <form id="workoutForm" class="grid-form">
                <div class="full-row">
                    <input type="text" id="exerciseName" placeholder="Hareket Adı" required />
                </div>
                <div>
                    <input type="number" id="weight" placeholder="Ağırlık (kg)" step="0.5" inputmode="decimal" required
                        oninput="calc1RM()" />
                </div>
                <div>
                    <input type="number" id="reps" placeholder="Tekrar" inputmode="numeric" required
                        oninput="calc1RM()" />
                </div>

                <div class="full-row live-preview">
                    <div>Tahmini 1RM: <span id="est1RM">0 KG</span></div>
                    <div>Set Hacmi: <span id="setVol">0 KG</span></div>
                </div>

                <div class="full-row">
                    <input type="number" id="setNumber" placeholder="Set No" value="1" inputmode="numeric" required />
                </div>
                <div class="full-row">
                    <button type="submit" class="btn-primary">Seti Kaydet & Sayacı Başlat</button>
                </div>
            </form>
        </div>

        <!-- Kayıtlar -->
        <div class="box">
            <h2>📋 Antrenman Kayıtları</h2>
            <div id="logsList">Yükleniyor...</div>
        </div>

    </div>

    <script>
        const API_URL = '/api/WorkoutLogs';

        // PPL Egzersiz Havuzu
        const routines = {
            push: ['Bench Press', 'Incline Dumbbell Press', 'Overhead Press', 'Lateral Raise', 'Triceps Pushdown', 'Dips'],
            pull: ['Barbell Row', 'Lat Pulldown', 'Seated Cable Row', 'Face Pull', 'Barbell Curl', 'Hammer Curl'],
            legs: ['Squat', 'Leg Press', 'Romanian Deadlift', 'Leg Curl', 'Leg Extension', 'Calf Raise']
        };

        let currentProgram = 'push';

        function renderQuickTags() {
            const container = document.getElementById('quickTags');
            container.innerHTML = '';
            routines[currentProgram].forEach(ex => {
                const span = document.createElement('span');
                span.className = 'tag';
                span.innerText = ex;
                span.onclick = () => selectExercise(ex);
                container.appendChild(span);
            });
        }

        function setProgram(prog, el) {
            currentProgram = prog;
            document.querySelectorAll('.split-tab').forEach(tab => tab.classList.remove('active'));
            el.classList.add('active');
            renderQuickTags();
        }

        function selectExercise(name) {
            document.getElementById('exerciseName').value = name;
            document.getElementById('prInput').value = name;
            document.getElementById('setNumber').value = 1;
            checkPR();
        }

        // Canlı 1RM Hesaplama (Epley Formülü: Ağırlık * (1 + Tekrar / 30))
        function calc1RM() {
            const w = parseFloat(document.getElementById('weight').value) || 0;
            const r = parseInt(document.getElementById('reps').value) || 0;

            const oneRM = r === 1 ? w : Math.round(w * (1 + r / 30) * 10) / 10;
            const vol = Math.round(w * r);

            document.getElementById('est1RM').innerText = `${oneRM} KG`;
            document.getElementById('setVol').innerText = `${vol} KG`;
        }

        // Dinlenme Sayacı (Rest Timer)
        let timerSeconds = 90;
        let timerInterval = null;

        function updateTimerDisplay() {
            const m = Math.floor(timerSeconds / 60);
            const s = timerSeconds % 60;
            document.getElementById('timer').innerText =
                `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerSeconds = 90;
            updateTimerDisplay();
        }

        function addTimer(sec) {
            timerSeconds += sec;
            updateTimerDisplay();
        }

        // API Fonksiyonları
        async function loadLogs() {
            const container = document.getElementById('logsList');
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error();
                const logs = await res.json();
                container.innerHTML = '';

                if (logs.length === 0) {
                    container.innerHTML = '<p style="color:var(--muted); font-size:13px; text-align:center;">Henüz set kaydedilmedi.</p>';
                    document.getElementById('totalVolume').innerHTML = `0 <span>KG</span>`;
                    document.getElementById('totalSets').innerHTML = `0 <span>SET</span>`;
                    return;
                }

                let totalVol = 0;
                logs.forEach(log => {
                    totalVol += (log.weight * log.reps);
                    const item = document.createElement('div');
                    item.className = 'log-item';
                    item.innerHTML = `
                        <div>
                            <strong>${log.exerciseName}</strong> &bull; Set ${log.setNumber}
                            <div class="details">${log.weight} KG &times; ${log.reps} Tekrar &bull; ${(log.weight * log.reps)} KG Hacim</div>
                        </div>
                        <button class="del-btn" onclick="deleteLog(${log.id})">Sil</button>
                    `;
                    container.appendChild(item);
                });

                document.getElementById('totalVolume').innerHTML = `${totalVol.toLocaleString()} <span>KG</span>`;
                document.getElementById('totalSets').innerHTML = `${logs.length} <span>SET</span>`;
            } catch (err) {
                container.innerHTML = '<p style="color:#ff4757; font-size:13px; text-align:center;">API bağlantısı kuruluyor...</p>';
            }
        }

        async function checkPR() {
            const name = document.getElementById('prInput').value.trim();
            const prBox = document.getElementById('prResult');
            if (!name) return;

            try {
                const res = await fetch(`${API_URL}/pr/${encodeURIComponent(name)}`);
                if (res.status === 404) {
                    prBox.style.display = 'block';
                    prBox.style.borderColor = '#333';
                    prBox.style.color = '#888';
                    prBox.innerText = `${name} için henüz rekor yok.`;
                    return;
                }
                const data = await res.json();
                prBox.style.display = 'block';
                prBox.style.borderColor = 'var(--accent)';
                prBox.style.color = 'var(--accent)';
                prBox.innerHTML = `🔥 <strong>${data.exercise}</strong> PR: <strong>${data.maxWeight} KG</strong>`;
            } catch (e) { console.error(e); }
        }

        document.getElementById('workoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const setInput = document.getElementById('setNumber');
            const curSet = parseInt(setInput.value) || 1;

            const payload = {
                exerciseName: document.getElementById('exerciseName').value,
                weight: parseFloat(document.getElementById('weight').value),
                reps: parseInt(document.getElementById('reps').value),
                setNumber: curSet
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                document.getElementById('weight').value = '';
                document.getElementById('reps').value = '';
                document.getElementById('est1RM').innerText = '0 KG';
                document.getElementById('setVol').innerText = '0 KG';
                setInput.value = curSet + 1;

                // Set kaydedilince otomatik dinlenme sayacını başlatır
                resetTimer();
                startTimer();

                loadLogs();
            } catch (err) {
                alert("Kayıt eklenemedi.");
            }
        });

        async function deleteLog(id) {
            try {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                loadLogs();
            } catch (err) {
                alert("Silinemedi.");
            }
        }

        // Başlangıç
        renderQuickTags();
        loadLogs();
    </script>
</body>

</html>
