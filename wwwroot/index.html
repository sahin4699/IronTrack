<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0f" />
    <title>IronTrack Pro - Elite Fitness & Beslenme Sistemi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg: #08090d;
            --surface: #0f1118;
            --surface-card: #151822;
            --border: #222736;
            --accent: #ff5e00;
            --accent-glow: rgba(255, 94, 0, 0.45);
            --gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --protein: #10b981;
            --carb: #3b82f6;
            --fat: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 18px 24px;
            min-height: 100vh;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(21, 24, 34, 0.9), rgba(15, 17, 24, 0.9));
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent), #e04800);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand h1 span {
            color: var(--accent);
        }

        .badge-pro {
            font-size: 10px;
            font-weight: 800;
            background: rgba(255, 94, 0, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 3px 8px;
            border-radius: 6px;
            margin-left: 6px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 360px 1.25fr 1fr;
            gap: 20px;
            max-width: 1650px;
            margin: 0 auto;
        }

        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .panel-title i {
            color: var(--accent);
        }

        /* YUVARLAK CANLI ADIMSAYAR PANELİ */
        .step-circle-box {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 12px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .ring-container {
            position: relative;
            width: 170px;
            height: 170px;
        }

        .ring-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .ring-bg {
            fill: none;
            stroke: #1b1f2b;
            stroke-width: 10;
        }

        .ring-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            transition: stroke-dashoffset 0.4s ease;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .ring-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .ring-content .steps-val {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            line-height: 1.1;
        }

        .ring-content .steps-lbl {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .step-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-top: 14px;
        }

        .step-sub-stat {
            background: #0d0f16;
            border: 1px solid #1c202d;
            border-radius: 10px;
            padding: 8px 10px;
            text-align: center;
        }

        .step-sub-stat .lbl {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .step-sub-stat .val {
            font-size: 15px;
            font-weight: 800;
            color: var(--gold);
            margin-top: 2px;
        }

        .step-btn-bar {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 10px;
        }

        .step-btn {
            flex: 1;
            background: #1e2330;
            border: 1px solid #2b3244;
            color: #fff;
            padding: 7px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .step-btn:hover,
        .step-btn:active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* KALORİ PANELİ & YEMEKLER */
        .cal-metric-box {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        .cal-num {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            margin: 4px 0;
        }

        .cal-num span {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .progress-track {
            height: 8px;
            background: #090a0f;
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid #1c202d;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--gold));
            width: 0%;
            transition: width 0.4s ease;
        }

        .macro-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 10px;
        }

        .macro-pill {
            background: #0d0f16;
            border: 1px solid #1d212d;
            border-radius: 8px;
            padding: 6px 4px;
            text-align: center;
        }

        .macro-pill .label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .macro-pill .val {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            margin-top: 2px;
        }

        .food-scroll {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .food-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .food-scroll::-webkit-scrollbar-thumb {
            background: #222736;
            border-radius: 4px;
        }

        .food-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .food-card:hover {
            border-color: var(--accent);
        }

        .food-thumb {
            width: 46px;
            height: 46px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .food-meta {
            flex: 1;
        }

        .food-name {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .food-cals {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .add-food-btn {
            background: #1e2330;
            border: 1px solid #2b3244;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .add-food-btn:hover {
            background: var(--accent);
            color: #000;
        }

        /* ORTA PANEL: ANATOMİ VE 3D ÇEVİRME */
        .anatomy-container {
            min-height: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1b1f2d 0%, #0d0f16 100%);
            border-radius: 20px;
            border: 1px solid var(--border);
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .flip-stage {
            width: 380px;
            height: 520px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .flip-stage.flipped {
            transform: rotateY(180deg);
        }

        .body-card {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .body-card.back-view {
            transform: rotateY(180deg);
        }

        .medical-render {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.95)) contrast(1.08) brightness(1.02);
            pointer-events: none;
            user-select: none;
        }

        .muscle-target-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .hotspot-node {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 94, 0, 0.75);
            background: rgba(255, 94, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            animation: pulseWave 2s infinite ease-in-out;
        }

        .hotspot-node:hover,
        .hotspot-node.active {
            background: var(--accent);
            border-color: #fff;
            box-shadow: 0 0 25px var(--accent);
            transform: scale(1.15);
        }

        @keyframes pulseWave {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
                box-shadow: 0 0 15px 5px rgba(255, 94, 0, 0.3);
            }

            100% {
                transform: scale(1);
                opacity: 0.8;
            }
        }

        .h-chest {
            top: 24%;
            left: 42%;
            width: 60px;
            height: 35px;
            border-radius: 10px;
        }

        .h-shoulder-l {
            top: 22%;
            left: 29%;
            width: 34px;
            height: 34px;
        }

        .h-shoulder-r {
            top: 22%;
            left: 63%;
            width: 34px;
            height: 34px;
        }

        .h-biceps-l {
            top: 26%;
            left: 21%;
            width: 34px;
            height: 34px;
        }

        .h-biceps-r {
            top: 26%;
            left: 71%;
            width: 34px;
            height: 34px;
        }

        .h-abs {
            top: 34%;
            left: 45%;
            width: 38px;
            height: 60px;
            border-radius: 10px;
        }

        .h-quad-l {
            top: 52%;
            left: 41%;
            width: 32px;
            height: 80px;
            border-radius: 14px;
        }

        .h-quad-r {
            top: 52%;
            left: 51%;
            width: 32px;
            height: 80px;
            border-radius: 14px;
        }

        .h-traps {
            top: 19%;
            left: 44%;
            width: 45px;
            height: 35px;
            border-radius: 8px;
        }

        .h-lats {
            top: 28%;
            left: 40%;
            width: 75px;
            height: 45px;
            border-radius: 12px;
        }

        .h-triceps-l {
            top: 25%;
            left: 21%;
            width: 34px;
            height: 34px;
        }

        .h-triceps-r {
            top: 25%;
            left: 71%;
            width: 34px;
            height: 34px;
        }

        .h-hams-l {
            top: 52%;
            left: 41%;
            width: 32px;
            height: 80px;
            border-radius: 14px;
        }

        .h-hams-r {
            top: 52%;
            left: 51%;
            width: 32px;
            height: 80px;
            border-radius: 14px;
        }

        .h-calves-l {
            top: 72%;
            left: 41%;
            width: 30px;
            height: 65px;
            border-radius: 10px;
        }

        .h-calves-r {
            top: 72%;
            left: 51%;
            width: 30px;
            height: 65px;
            border-radius: 10px;
        }

        .view-indicator {
            position: absolute;
            bottom: 14px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            background: rgba(15, 17, 24, 0.7);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }

        /* SAĞ PANEL: HAREKETLER & SET KAYDI */
        .exercise-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .exercise-item {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .exercise-item:hover {
            border-color: var(--accent);
            background: #1a1e2b;
        }

        .exercise-item .title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .exercise-item .sub {
            font-size: 11px;
            color: var(--accent);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        .workout-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .full-span {
            grid-column: span 2;
        }

        input {
            width: 100%;
            background: #090a0f;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #e04800);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 18px var(--accent-glow);
        }

        .log-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent);
        }

        /* MODAL */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            width: 100%;
            max-width: 520px;
            overflow: hidden;
        }

        .modal-head {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .video-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <header class="app-header">
        <div class="brand">
            <div class="brand-logo"><i class="fa-solid fa-person-walking"></i></div>
            <h1>IRON<span>TRACK</span> <span class="badge-pro">PRO</span></h1>
        </div>
        <div style="font-size: 13px; font-weight: 700; color: var(--accent);" id="headerCal">
            0 / 2500 KCAL
        </div>
    </header>

    <main class="main-layout">

        <!-- 1. KOLON: CANLI YUVARLAK ADIMSAYAR & BESLENME -->
        <section class="panel">
            <div class="panel-header">
                <div class="panel-title"><i class="fa-solid fa-person-running"></i> Canlı Adımsayar</div>
                <button onclick="resetSteps()"
                    style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:12px;"><i
                        class="fa-solid fa-rotate-right"></i> Sıfırla</button>
            </div>

            <!-- YUVARLAK ADIMSAYAR & YAKILAN KALORİ HALKASI -->
            <div class="step-circle-box">
                <div class="ring-container">
                    <svg class="ring-svg" viewBox="0 0 160 160">
                        <circle class="ring-bg" cx="80" cy="80" r="70" />
                        <circle class="ring-progress" id="stepProgressRing" cx="80" cy="80" r="70" />
                    </svg>
                    <div class="ring-content">
                        <i class="fa-solid fa-shoe-prints"
                            style="color:var(--accent); font-size:14px; margin-bottom:2px;"></i>
                        <div class="steps-val" id="stepCountDisplay">0</div>
                        <div class="steps-lbl">/ 10.000 Adım</div>
                    </div>
                </div>

                <div class="step-stats-grid">
                    <div class="step-sub-stat">
                        <div class="lbl">🔥 Yakılan Kalori</div>
                        <div class="val" id="burnedCalDisplay">0.0 <span>kcal</span></div>
                    </div>
                    <div class="step-sub-stat">
                        <div class="lbl">📍 Mesafe</div>
                        <div class="val" id="distanceDisplay">0.00 <span>km</span></div>
                    </div>
                </div>

                <div class="step-btn-bar">
                    <button class="step-btn" id="startSensorBtn" onclick="toggleStepCounter()"><i
                            class="fa-solid fa-play"></i> Takibi Başlat</button>
                    <button class="step-btn" onclick="simulateManualStep()"><i class="fa-solid fa-plus"></i> Manuel
                        +50</button>
                </div>
            </div>

            <!-- KALORİ VE BESİNLER -->
            <div class="panel-header" style="margin-top: 8px;">
                <div class="panel-title" style="font-size: 13px;"><i class="fa-solid fa-bowl-food"></i> Alınan Kalori &
                    Makrolar</div>
                <button onclick="resetNutrition()"
                    style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:11px;"><i
                        class="fa-solid fa-rotate-right"></i></button>
            </div>

            <div class="cal-metric-box">
                <div class="cal-num"><span id="metricCal">0</span> <span>/ 2500 KCAL</span></div>
                <div class="progress-track">
                    <div class="progress-bar" id="metricBar"></div>
                </div>
                <div class="macro-row">
                    <div class="macro-pill">
                        <div class="label" style="color:var(--protein);">Protein</div>
                        <div class="val"><span id="metricP">0</span>g</div>
                    </div>
                    <div class="macro-pill">
                        <div class="label" style="color:var(--carb);">Karb</div>
                        <div class="val"><span id="metricC">0</span>g</div>
                    </div>
                    <div class="macro-pill">
                        <div class="label" style="color:var(--fat);">Yağ</div>
                        <div class="val"><span id="metricF">0</span>g</div>
                    </div>
                </div>
            </div>

            <div class="food-scroll" id="foodContainer"></div>
        </section>

        <!-- 2. KOLON: MEDİKAL ANATOMİ VE 3D FLIP -->
        <section class="anatomy-container" onclick="flipAnatomy(event)">
            <div class="flip-stage" id="stageCard">

                <!-- ÖN ANATOMİ -->
                <div class="body-card">
                    <img src="https://raw.githubusercontent.com/sahin4699/IronTrack/main/wwwroot/front_muscle.png"
                        onerror="this.src='https://cdn.pixabay.com/photo/2021/04/17/14/40/anatomy-6186026_1280.png'"
                        alt="Ön Medikal Kas Anatomisi" class="medical-render" />

                    <div class="muscle-target-layer">
                        <div class="hotspot-node h-chest active" onclick="pickMuscle('chest', event)"
                            title="Göğüs Kasları"></div>
                        <div class="hotspot-node h-shoulder-l" onclick="pickMuscle('shoulders', event)"
                            title="Sol Omuz"></div>
                        <div class="hotspot-node h-shoulder-r" onclick="pickMuscle('shoulders', event)"
                            title="Sağ Omuz"></div>
                        <div class="hotspot-node h-biceps-l" onclick="pickMuscle('biceps', event)" title="Sol Kol">
                        </div>
                        <div class="hotspot-node h-biceps-r" onclick="pickMuscle('biceps', event)" title="Sağ Kol">
                        </div>
                        <div class="hotspot-node h-abs" onclick="pickMuscle('abs', event)" title="Karın"></div>
                        <div class="hotspot-node h-quad-l" onclick="pickMuscle('quads', event)" title="Sol Ön Bacak">
                        </div>
                        <div class="hotspot-node h-quad-r" onclick="pickMuscle('quads', event)" title="Sağ Ön Bacak">
                        </div>
                    </div>
                </div>

                <!-- ARKA ANATOMİ -->
                <div class="body-card back-view">
                    <img src="https://raw.githubusercontent.com/sahin4699/IronTrack/main/wwwroot/back_muscle.png"
                        onerror="this.src='https://cdn.pixabay.com/photo/2021/04/17/14/40/anatomy-6186027_1280.png'"
                        alt="Arka Medikal Kas Anatomisi" class="medical-render" />

                    <div class="muscle-target-layer">
                        <div class="hotspot-node h-traps" onclick="pickMuscle('traps', event)" title="Trapez"></div>
                        <div class="hotspot-node h-lats" onclick="pickMuscle('lats', event)" title="Kanat & Sırt"></div>
                        <div class="hotspot-node h-triceps-l" onclick="pickMuscle('triceps', event)"
                            title="Sol Triceps"></div>
                        <div class="hotspot-node h-triceps-r" onclick="pickMuscle('triceps', event)"
                            title="Sağ Triceps"></div>
                        <div class="hotspot-node h-hams-l" onclick="pickMuscle('hamstrings', event)"
                            title="Sol Arka Bacak"></div>
                        <div class="hotspot-node h-hams-r" onclick="pickMuscle('hamstrings', event)"
                            title="Sağ Arka Bacak"></div>
                        <div class="hotspot-node h-calves-l" onclick="pickMuscle('calves', event)" title="Sol Kalf">
                        </div>
                        <div class="hotspot-node h-calves-r" onclick="pickMuscle('calves', event)" title="Sağ Kalf">
                        </div>
                    </div>
                </div>

            </div>
            <div class="view-indicator"><i class="fa-solid fa-arrows-rotate"></i> Vücudu çevirmek için dokun</div>
        </section>

        <!-- 3. KOLON: EGZERSİZLER & ANTRENMAN GİRİŞİ -->
        <section class="panel">
            <div class="panel-header">
                <div class="panel-title" id="activeMuscleLabel"><i class="fa-solid fa-fire"></i> Göğüs (Chest)
                    Egzersizleri</div>
            </div>

            <div class="exercise-grid" id="exerciseGrid"></div>

            <form id="workoutForm" class="workout-form">
                <div class="full-span">
                    <input type="text" id="exerciseName" placeholder="Seçilen Egzersiz" required />
                </div>
                <div>
                    <input type="number" id="weight" placeholder="Ağırlık (kg)" step="0.5" inputmode="decimal"
                        required />
                </div>
                <div>
                    <input type="number" id="reps" placeholder="Tekrar" inputmode="numeric" required />
                </div>
                <div class="full-span">
                    <input type="number" id="setNumber" placeholder="Set No" value="1" inputmode="numeric" required />
                </div>
                <div class="full-span">
                    <button type="submit" class="btn-submit">Seti Kaydet</button>
                </div>
            </form>

            <div class="panel-header" style="margin-bottom: 8px;">
                <div class="panel-title" style="font-size: 13px;"><i class="fa-solid fa-list-check"></i> Antrenman
                    Kayıtları</div>
            </div>
            <div id="logsList" style="max-height: 220px; overflow-y: auto;">Yükleniyor...</div>
        </section>

    </main>

    <!-- Video Modal -->
    <div class="modal-backdrop" id="videoModal">
        <div class="modal-box">
            <div class="modal-head">
                <strong id="modalTitle" style="color:var(--accent);">Egzersiz Formu</strong>
                <button onclick="closeModal()"
                    style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">&times;</button>
            </div>
            <div class="video-box">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>
            <div style="padding:14px;">
                <button class="btn-submit" onclick="selectFromModal()">Bu Hareketi Antrenmana Seç</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/WorkoutLogs';

        /* 1. CANLI ADIMSAYAR DONANIM VE HESAPLAMA MOTORU */
        let stepCount = parseInt(localStorage.getItem('ironStepCount')) || 0;
        let isSensorRunning = false;
        let lastAcceleration = { x: null, y: null, z: null };
        let lastStepTimestamp = 0;
        const STEP_THRESHOLD = 11.5; // İvme eşiği (m/s²)
        const STEP_DELAY = 330;      // İki adım arasındaki minimum ms (çift sayımı engeller)
        const CIRCLE_CIRCUMFERENCE = 440; // 2 * pi * r (r=70) -> 439.82

        function updateStepUI() {
            document.getElementById('stepCountDisplay').innerText = stepCount.toLocaleString();

            // Ortalama 1 adım = 0.040 kcal, 1 adım = 0.75 metre
            const burnedCal = (stepCount * 0.040).toFixed(1);
            const distance = ((stepCount * 0.75) / 1000).toFixed(2);

            document.getElementById('burnedCalDisplay').innerHTML = `${burnedCal} <span>kcal</span>`;
            document.getElementById('distanceDisplay').innerHTML = `${distance} <span>km</span>`;

            // Dairesel Progress Barı Güncelle (Hedef: 10.000 Adım)
            const target = 10000;
            const progress = Math.min(1, stepCount / target);
            const offset = CIRCLE_CIRCUMFERENCE - (progress * CIRCLE_CIRCUMFERENCE);
            document.getElementById('stepProgressRing').style.strokeDashoffset = offset;

            localStorage.setItem('ironStepCount', stepCount);
        }

        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity || event.acceleration;
            if (!acc || acc.x === null) return;

            const currentMagnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
            const now = Date.now();

            if (currentMagnitude > STEP_THRESHOLD && (now - lastStepTimestamp > STEP_DELAY)) {
                stepCount++;
                lastStepTimestamp = now;
                updateStepUI();
                if (navigator.vibrate) navigator.vibrate(30);
            }
        }

        async function toggleStepCounter() {
            const btn = document.getElementById('startSensorBtn');

            if (!isSensorRunning) {
                // iOS 13+ Sensör İzni İsteme
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    try {
                        const permission = await DeviceMotionEvent.requestPermission();
                        if (permission !== 'granted') {
                            alert("Adımsayar için hareket sensörü izni gereklidir.");
                            return;
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }

                window.addEventListener('devicemotion', handleMotion);
                isSensorRunning = true;
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> Duraklat';
                btn.style.background = 'var(--accent)';
                btn.style.color = '#000';
            } else {
                window.removeEventListener('devicemotion', handleMotion);
                isSensorRunning = false;
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Takibi Başlat';
                btn.style.background = '#1e2330';
                btn.style.color = '#fff';
            }
        }

        function simulateManualStep() {
            stepCount += 50;
            updateStepUI();
        }

        function resetSteps() {
            stepCount = 0;
            updateStepUI();
        }

        /* 2. BESİNLER & FATSECRET KALORİ MOTORU */
        const foodDatabase = [
            { name: "Izgara Tavuk Göğsü (150g)", cal: 247, p: 46, c: 0, f: 5, img: "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=150&auto=format&fit=crop&q=80" },
            { name: "Pirinç Pilavı (200g)", cal: 260, p: 5, c: 57, f: 1, img: "https://images.unsplash.com/photo-1516684732162-798a0062be99?w=150&auto=format&fit=crop&q=80" },
            { name: "Yulaf & Muz Kasesi (80g)", cal: 310, p: 10, c: 58, f: 5, img: "https://images.unsplash.com/photo-1517673400267-0251440c45dc?w=150&auto=format&fit=crop&q=80" },
            { name: "Haşlanmış Yumurta (3 Adet)", cal: 215, p: 18, c: 1, f: 15, img: "https://images.unsplash.com/photo-1582722872445-44dc5f7e3c8f?w=150&auto=format&fit=crop&q=80" },
            { name: "Izgara Kasap Köfte (160g)", cal: 340, p: 30, c: 4, f: 22, img: "https://images.unsplash.com/photo-1529042410759-befb1204b468?w=150&auto=format&fit=crop&q=80" },
            { name: "Whey Protein Shake (1 Ölçek)", cal: 120, p: 24, c: 2, f: 1.5, img: "https://images.unsplash.com/photo-1593095948071-474c5cc2989d?w=150&auto=format&fit=crop&q=80" },
            { name: "Lor Peyniri (100g)", cal: 98, p: 12, c: 3, f: 4, img: "https://images.unsplash.com/photo-1559561853-08451507cbe7?w=150&auto=format&fit=crop&q=80" }
        ];

        let nutrition = JSON.parse(localStorage.getItem('ironNutritionData')) || { cal: 0, p: 0, c: 0, f: 0 };

        function renderFoodCatalog() {
            const container = document.getElementById('foodContainer');
            container.innerHTML = '';
            foodDatabase.forEach((food, index) => {
                const item = document.createElement('div');
                item.className = 'food-card';
                item.innerHTML = `
                    <img src="${food.img}" alt="${food.name}" class="food-thumb" />
                    <div class="food-meta">
                        <div class="food-name">${food.name}</div>
                        <div class="food-cals">${food.cal} kcal &bull; P:${food.p}g K:${food.c}g Y:${food.f}g</div>
                    </div>
                    <button class="add-food-btn" onclick="addFoodItem(${index})"><i class="fa-solid fa-plus"></i></button>
                `;
                container.appendChild(item);
            });
            syncNutritionUI();
        }

        function addFoodItem(index) {
            const f = foodDatabase[index];
            nutrition.cal += f.cal;
            nutrition.p += f.p;
            nutrition.c += f.c;
            nutrition.f += f.f;
            localStorage.setItem('ironNutritionData', JSON.stringify(nutrition));
            syncNutritionUI();
        }

        function resetNutrition() {
            nutrition = { cal: 0, p: 0, c: 0, f: 0 };
            localStorage.setItem('ironNutritionData', JSON.stringify(nutrition));
            syncNutritionUI();
        }

        function syncNutritionUI() {
            document.getElementById('metricCal').innerText = nutrition.cal;
            document.getElementById('metricP').innerText = nutrition.p;
            document.getElementById('metricC').innerText = nutrition.c;
            document.getElementById('metricF').innerText = nutrition.f;

            const percentage = Math.min(100, Math.round((nutrition.cal / 2500) * 100));
            document.getElementById('metricBar').style.width = `${percentage}%`;
            document.getElementById('headerCal').innerText = `${nutrition.cal} / 2500 KCAL`;
        }

        /* 3. ANATOMİK FLIP & HAREKET LİSTESİ */
        let flippedState = false;
        function flipAnatomy(event) {
            if (event.target.classList.contains('hotspot-node')) return;
            const stage = document.getElementById('stageCard');
            flippedState = !flippedState;
            stage.classList.toggle('flipped', flippedState);
        }

        const exercisesDB = {
            chest: {
                title: "Göğüs (Chest) Egzersizleri",
                items: [
                    { name: "Barbell Bench Press", videoId: "rT7DgCr-3pg", meta: "Bileşik • Güç" },
                    { name: "Incline Dumbbell Press", videoId: "8iPEnn-ltC8", meta: "Üst Göğüs" },
                    { name: "Cable Fly", videoId: "Z57CtFmRMxA", meta: "İzolasyon" },
                    { name: "Chest Dips", videoId: "2z8JmcrW-As", meta: "Alt Göğüs" }
                ]
            },
            shoulders: {
                title: "Omuz (Deltoids) Egzersizleri",
                items: [
                    { name: "Overhead Barbell Press", videoId: "2yjwXTZQDDI", meta: "Bileşik • Güç" },
                    { name: "Dumbbell Lateral Raise", videoId: "3VcKaXpzqRo", meta: "Yan Omuz" },
                    { name: "Face Pull", videoId: "rep-qVOkqgk", meta: "Arka Omuz" }
                ]
            },
            biceps: {
                title: "Biceps (Ön Kol) Egzersizleri",
                items: [
                    { name: "Barbell Biceps Curl", videoId: "ykJmrZ5v0Oo", meta: "Kütle" },
                    { name: "Incline Curl", videoId: "soxrZlIl35U", meta: "Uzun Baş" },
                    { name: "Hammer Curl", videoId: "zC3nLlEvin4", meta: "Brachialis" }
                ]
            },
            triceps: {
                title: "Triceps (Arka Kol) Egzersizleri",
                items: [
                    { name: "Triceps Pushdown", videoId: "vB5OHsJ3EME", meta: "İzolasyon" },
                    { name: "Skull Crusher", videoId: "d_KZxkH_toI", meta: "Kütle" }
                ]
            },
            abs: {
                title: "Karın (Core) Egzersizleri",
                items: [
                    { name: "Hanging Leg Raise", videoId: "hdng3Nm1x_E", meta: "Alt Karın" },
                    { name: "Cable Crunch", videoId: "pZapRXZcggU", meta: "Üst Karın" }
                ]
            },
            quads: {
                title: "Ön Bacak (Quadriceps) Egzersizleri",
                items: [
                    { name: "Barbell Back Squat", videoId: "bEv6CCg2BC8", meta: "Bileşik • Güç" },
                    { name: "Leg Press", videoId: "IZxyjW7MPJQ", meta: "Hipertrofi" }
                ]
            },
            lats: {
                title: "Kanat & Sırt (Lats) Egzersizleri",
                items: [
                    { name: "Barbell Row", videoId: "9efgc2TrvEg", meta: "Kalınlık" },
                    { name: "Lat Pulldown", videoId: "CAwf7n6Luuc", meta: "Genişlik" },
                    { name: "Deadlift", videoId: "op9kVnSso6Q", meta: "Tüm Sırt" }
                ]
            },
            traps: {
                title: "Trapez Egzersizleri",
                items: [{ name: "Barbell Shrug", videoId: "g6qbq4Du13Q", meta: "Trapez Kütle" }]
            },
            hamstrings: {
                title: "Arka Bacak (Hamstrings) Egzersizleri",
                items: [
                    { name: "Romanian Deadlift", videoId: "JCXUYuzwNrM", meta: "Gerilim" },
                    { name: "Lying Leg Curl", videoId: "ELOCsoDSmrg", meta: "İzolasyon" }
                ]
            },
            calves: {
                title: "Baldır (Calves) Egzersizleri",
                items: [{ name: "Standing Calf Raise", videoId: "-M4-G8p8fmc", meta: "Kalf" }]
            }
        };

        function pickMuscle(key, event) {
            if (event) event.stopPropagation();
            document.querySelectorAll('.hotspot-node').forEach(node => node.classList.remove('active'));
            if (event) event.target.classList.add('active');

            const muscle = exercisesDB[key];
            if (!muscle) return;

            document.getElementById('activeMuscleLabel').innerHTML = `<i class="fa-solid fa-fire"></i> ${muscle.title}`;
            const grid = document.getElementById('exerciseGrid');
            grid.innerHTML = '';

            muscle.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'exercise-item';
                card.innerHTML = `
                    <div class="title">${item.name}</div>
                    <div class="sub"><span>${item.meta}</span><span><i class="fa-solid fa-play"></i> Video</span></div>
                `;
                card.onclick = () => showVideoModal(item.name, item.videoId);
                grid.appendChild(card);
            });
        }

        let activePickedExercise = "";
        function showVideoModal(name, id) {
            activePickedExercise = name;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1`;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('videoPlayer').src = '';
            document.getElementById('videoModal').style.display = 'none';
        }

        function selectFromModal() {
            document.getElementById('exerciseName').value = activePickedExercise;
            closeModal();
        }

        /* 4. ANTRENMAN KAYITLARI & API */
        async function fetchWorkoutLogs() {
            const list = document.getElementById('logsList');
            try {
                const res = await fetch(API_URL);
                const logs = await res.json();
                list.innerHTML = '';

                if (logs.length === 0) {
                    list.innerHTML = '<p style="color:var(--text-muted); font-size:12px; text-align:center; padding:10px 0;">Henüz set kaydedilmedi.</p>';
                    return;
                }

                logs.forEach(log => {
                    const row = document.createElement('div');
                    row.className = 'log-entry';
                    row.innerHTML = `
                        <div>
                            <strong style="font-size:13px; color:#fff;">${log.exerciseName}</strong> &bull; Set ${log.setNumber}
                            <div style="color:var(--accent); font-size:11px; font-weight:700; margin-top:2px;">${log.weight} KG &times; ${log.reps} Tekrar</div>
                        </div>
                        <button onclick="removeLog(${log.id})" style="background:#261318; border:1px solid #4a1922; color:#ff4d4f; padding:5px 10px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer;">Sil</button>
                    `;
                    list.appendChild(row);
                });
            } catch (err) {
                list.innerHTML = '<p style="color:var(--text-muted); font-size:12px; text-align:center;">Kayıtlar listelenmeye hazır.</p>';
            }
        }

        document.getElementById('workoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const setInput = document.getElementById('setNumber');
            const currentSet = parseInt(setInput.value) || 1;

            const payload = {
                exerciseName: document.getElementById('exerciseName').value,
                weight: parseFloat(document.getElementById('weight').value),
                reps: parseInt(document.getElementById('reps').value),
                setNumber: currentSet
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('weight').value = '';
            document.getElementById('reps').value = '';
            setInput.value = currentSet + 1;
            fetchWorkoutLogs();
        });

        async function removeLog(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchWorkoutLogs();
        }

        window.onload = () => {
            updateStepUI();
            renderFoodCatalog();
            pickMuscle('chest');
            fetchWorkoutLogs();
        };
    </script>
</body>

</html>
