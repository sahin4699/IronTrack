<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IronTrack" />
    <title>IronTrack - Anatomi & Antrenman Takip</title>

    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #121316;
            --card-border: #1f2229;
            --accent: #ff6b00;
            --accent-hover: #ff8533;
            --accent-glow: rgba(255, 107, 0, 0.4);
            --gold: #ffa502;
            --text: #f5f6fa;
            --muted: #8a8f9d;
            --muscle-base: #242933;
            --muscle-stroke: #171920;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
            padding-left: calc(env(safe-area-inset-left, 0px) + 14px);
            padding-right: calc(env(safe-area-inset-right, 0px) + 14px);
            min-height: 100vh;
        }

        .container {
            max-width: 620px;
            margin: 0 auto;
        }

        /* Hero */
        .hero {
            background: linear-gradient(145deg, #16181d, #0d0e11);
            border: 1px solid #282c35;
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            margin-bottom: 14px;
        }

        .hero-text h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .hero-text h1 span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .hero-text p {
            color: var(--muted);
            font-size: 11px;
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* 3D Anatomik Model Kutusu */
        .anatomy-card {
            background: radial-gradient(circle at center, #171a22 0%, #0c0d10 100%);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        .view-switch {
            display: inline-flex;
            background: #111216;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 12px;
            gap: 4px;
        }

        .switch-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 7px 18px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .switch-btn.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        /* İnsan Anatomisi Vektör Alanı */
        .body-viewport {
            width: 100%;
            height: 330px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 800px;
        }

        .body-flip-container {
            width: 220px;
            height: 320px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .body-flip-container.flipped {
            transform: rotateY(180deg);
        }

        .body-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .body-face.back {
            transform: rotateY(180deg);
        }

        .muscle-part {
            fill: var(--muscle-base);
            stroke: var(--muscle-stroke);
            stroke-width: 1.5;
            cursor: pointer;
            transition: fill 0.25s, filter 0.25s;
        }

        .muscle-part:hover {
            fill: #343b49;
        }

        .muscle-part.active {
            fill: var(--accent) !important;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .anatomy-hint {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Kartlar & Form */
        .box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .box h2 {
            font-size: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .exercise-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .ex-card {
            background: #090a0d;
            border: 1px solid #232732;
            border-radius: 10px;
            padding: 11px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ex-card:hover,
        .ex-card:active {
            border-color: var(--accent);
            background: #14171f;
        }

        .ex-card .title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .ex-card .meta {
            font-size: 11px;
            color: var(--accent);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* Form */
        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .full-row {
            grid-column: span 2;
        }

        input {
            width: 100%;
            background: #090a0d;
            border: 1px solid #232732;
            border-radius: 10px;
            padding: 13px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button.btn-primary {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        button.btn-primary:active {
            transform: scale(0.98);
        }

        /* Dinlenme Barı */
        .timer-bar {
            background: #14171d;
            border: 1px solid #282d38;
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        /* Modal */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .modal-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0c0d10;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent);
        }
    </style>
</head>

<body>

        <!-- Seçilen Kasın Hareketleri -->

        <!-- Dinlenme Sayacı -->

            </div>
            <div style="display:flex; gap:6px;">
                <button onclick="startTimer()"
                    style="background:#232732; border:none; color:#fff; padding:6px 12px; border-radius:6px; font-weight:700;">Başlat</button>
                <button onclick="resetTimer()"
                    style="background:#232732; border:none; color:#fff; padding:6px 12px; border-radius:6px; font-weight:700;">Sıfırla</button>

        <!-- Set Giriş Formu -->
        <div class="box">
            <h2>➕ Set Ekle</h2>
            <form id="workoutForm" class="grid-form">
                <div class="full-row">
                    <input type="text" id="exerciseName" placeholder="Seçilen Egzersiz" required />
                </div>
                <div>
                    <input type="number" id="weight" placeholder="Ağırlık (kg)" step="0.5" inputmode="decimal"
                        required />
                </div>
                <div>
                    <input type="number" id="reps" placeholder="Tekrar" inputmode="numeric" required />

                <div class="full-row">
                    <input type="number" id="setNumber" placeholder="Set No" value="1" inputmode="numeric" required />

        </div>

        <!-- Kayıtlar -->

    <!-- Video Modal -->

                    style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer;">&times;</button>
            </div>
            <div class="video-wrapper">
                <iframe id="videoFrame" src="" allowfullscreen></iframe>
            </div>
            <div style="padding:12px;">
                <button class="btn-primary" onclick="useExerciseFromModal()">Bu Hareketi Antrenmana Seç</button>
            </div>
        </div>

    <script>
        const API_URL = '/api/WorkoutLogs';

        // Detaylı Kas & Egzersiz Kütüphanesi
        const muscleLibrary = {
            chest: {
                title: "🎯 GÖĞÜS (CHEST)",
                exercises: [
                    { name: "Barbell Bench Press", videoId: "rT7DgCr-3pg", meta: "Bileşik • Güç" },
                    { name: "Incline Dumbbell Press", videoId: "8iPEnn-ltC8", meta: "Üst Göğüs" },
                    { name: "Chest Cable Fly", videoId: "Z57CtFmRMxA", meta: "İzolasyon" },
                    { name: "Chest Dips", videoId: "2z8JmcrW-As", meta: "Alt Göğüs" }
                ]
            },
            shoulders: {
                title: "🎯 OMUZ (DELTOIDS)",
                exercises: [
                    { name: "Overhead Barbell Press", videoId: "2yjwXTZQDDI", meta: "Bileşik • Güç" },
                    { name: "Dumbbell Lateral Raise", videoId: "3VcKaXpzqRo", meta: "Yan Omuz" },

            },

            },
            triceps: {

                exercises: [
                    { name: "Triceps Pushdown", videoId: "vB5OHsJ3EME", meta: "İzolasyon" },
                    { name: "Skull Crusher", videoId: "d_KZxkH_toI", meta: "Kütle" },
                    { name: "Overhead Extension", videoId: "nRiJVZDpdL0", meta: "Uzun Baş" }
                ]
            },
            lats: {

                exercises: [
                    { name: "Barbell Bent-Over Row", videoId: "9efgc2TrvEg", meta: "Kalınlık" },
                    { name: "Lat Pulldown", videoId: "CAwf7n6Luuc", meta: "Genişlik" },
                    { name: "Seated Cable Row", videoId: "GZbfZ033f74", meta: "Orta Sırt" }
                ]
            },
            traps: {
                title: "🎯 TRAPEZ & BOYUN",
                exercises: [
                    { name: "Barbell Shrug", videoId: "g6qbq4Du13Q", meta: "Trapez" },
                    { name: "Dumbbell Farmer Walk", videoId: "Fkzk_RqlYig", meta: "Kondisyon" }
                ]
            },
            abs: {
                title: "🎯 KARIN (CORE)",
                exercises: [
                    { name: "Hanging Leg Raise", videoId: "hdng3Nm1x_E", meta: "Alt Karın" },
                    { name: "Cable Woodchopper", videoId: "pZapRXZcggU", meta: "Oblik" }
                ]
            },
            quads: {
                title: "🎯 ÖN BACAK (QUADRICEPS)",
                exercises: [
                    { name: "Barbell Back Squat", videoId: "bEv6CCg2BC8", meta: "Temel Güç" },
                    { name: "Leg Press", videoId: "IZxyjW7MPJQ", meta: "Hipertrofi" },
                    { name: "Leg Extension", videoId: "m0FOpMEgero", meta: "İzolasyon" }
                ]
            },
            hamstrings: {
                title: "🎯 ARKA BACAK (HAMSTRINGS)",
                exercises: [
                    { name: "Romanian Deadlift", videoId: "JCXUYuzwNrM", meta: "Gerilim" },
                    { name: "Lying Leg Curl", videoId: "ELOCsoDSmrg", meta: "İzolasyon" }
                ]
            },
            glutes: {
                title: "🎯 KALÇA (GLUTES)",
                exercises: [
                    { name: "Barbell Hip Thrust", videoId: "SEdqd1n0cvg", meta: "Ana Güç" },
                    { name: "Bulgarian Split Squat", videoId: "2C-uNgKwPLE", meta: "Tek Bacak" }
                ]
            },
            calves: {
                title: "🎯 BALDIR (CALVES)",
                exercises: [
                    { name: "Standing Calf Raise", videoId: "-M4-G8p8fmc", meta: "Gastrocnemius" },
                    { name: "Seated Calf Raise", videoId: "JbyjNymZOt0", meta: "Soleus" }
                ]
            }
        };

        let selectedExName = "";

        // Ön/Arka Vücut Çevirme
        function toggleView(view) {
            const container = document.getElementById('flipContainer');
            const btnFront = document.getElementById('btnFront');
            const btnBack = document.getElementById('btnBack');

            if (view === 'back') {
                container.classList.add('flipped');
                btnBack.classList.add('active');
                btnFront.classList.remove('active');
            } else {
                container.classList.remove('flipped');
                btnFront.classList.add('active');
                btnBack.classList.remove('active');
            }
        }

        // Kasa Tıklandığında Tetiklenen Olay
        function bindMuscleEvents() {
            document.querySelectorAll('.muscle-part').forEach(part => {
                part.addEventListener('click', () => {
                    const muscleKey = part.getAttribute('data-muscle');
                    if (!muscleKey || !muscleLibrary[muscleKey]) return;

                    // Aktif stili güncelle
                    document.querySelectorAll('.muscle-part').forEach(p => p.classList.remove('active'));
                    document.querySelectorAll(`[data-muscle="${muscleKey}"]`).forEach(p => p.classList.add('active'));

                    loadMuscleExercises(muscleKey);
                });
            });
        }

        function loadMuscleExercises(key) {
            const data = muscleLibrary[key];
            document.getElementById('muscleTitle').innerText = data.title;
            const grid = document.getElementById('exerciseGrid');
            grid.innerHTML = '';

            data.exercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'ex-card';
                card.innerHTML = `
                    <div class="title">${ex.name}</div>
                    <div class="meta"><span>${ex.meta}</span><span>▶ Video</span></div>
                `;
                card.onclick = () => openVideo(ex.name, ex.videoId);
                grid.appendChild(card);
            });
        }

        // Video Modal
        function openVideo(name, videoId) {
            selectedExName = name;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1`;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('videoFrame').src = '';
            document.getElementById('videoModal').style.display = 'none';
        }

        function useExerciseFromModal() {
            document.getElementById('exerciseName').value = selectedExName;
            closeModal();
            window.scrollTo({ top: document.getElementById('workoutForm').offsetTop - 20, behavior: 'smooth' });
        }

        // Dinlenme Sayacı
        let tSec = 90, tInt = null;
        function updateT() {
            const m = Math.floor(tSec / 60), s = tSec % 60;
            document.getElementById('timer').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        function startTimer() {
            clearInterval(tInt);
            tInt = setInterval(() => {
                if (tSec > 0) { tSec--; updateT(); }
                else clearInterval(tInt);
            }, 1000);
        }
        function resetTimer() { clearInterval(tInt); tSec = 90; updateT(); }

        // API İşlemleri
        async function loadLogs() {
            const container = document.getElementById('logsList');
            try {
                const res = await fetch(API_URL);
                const logs = await res.json();
                container.innerHTML = '';
                if (logs.length === 0) {
                    container.innerHTML = '<p style="color:var(--muted); font-size:13px; text-align:center;">Henüz set kaydedilmedi.</p>';
                    return;
                }
                logs.forEach(log => {
                    const item = document.createElement('div');
                    item.className = 'log-item';
                    item.innerHTML = `
                        <div>
                            <strong>${log.exerciseName}</strong> &bull; Set ${log.setNumber}
                            <div style="color:var(--accent); font-size:12px; font-weight:700;">${log.weight} KG &times; ${log.reps} Tekrar</div>
                        </div>
                        <button style="background:#1f1113; color:#ff4757; border:none; padding:6px 12px; border-radius:6px; font-weight:700;" onclick="deleteLog(${log.id})">Sil</button>
                    `;
                    container.appendChild(item);
                });
            } catch (e) {
                container.innerHTML = '<p style="color:var(--muted); font-size:13px; text-align:center;">Kayıtlar listelenmeye hazır.</p>';
            }
        }

        document.getElementById('workoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const setInput = document.getElementById('setNumber');
            const cSet = parseInt(setInput.value) || 1;
            const payload = {
                exerciseName: document.getElementById('exerciseName').value,
                weight: parseFloat(document.getElementById('weight').value),
                reps: parseInt(document.getElementById('reps').value),
                setNumber: cSet
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('weight').value = '';
            document.getElementById('reps').value = '';
            setInput.value = cSet + 1;
            resetTimer();
            startTimer();
            loadLogs();
        });

        async function deleteLog(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            loadLogs();
        }

        // Başlangıç
        window.onload = () => {
            bindMuscleEvents();
            loadMuscleExercises('chest');
            loadLogs();
        };
    </script>
</body>

</html>
