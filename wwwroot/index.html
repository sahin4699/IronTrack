<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <title>IronTrack Pro - Medikal Anatomi & Beslenme Paneli</title>

    <style>
        :root {
            --bg: #07080a;
            --card-bg: #111317;
            --card-border: #1d212a;
            --accent: #ff6b00;
            --accent-hover: #ff8533;
            --accent-glow: rgba(255, 107, 0, 0.45);
            --gold: #ffa502;
            --text: #f5f6fa;
            --muted: #8a8f9d;
            --protein: #2ed573;
            --carb: #1e90ff;
            --fat: #ffa502;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px 20px;
            min-height: 100vh;
        }

        /* Üst Header Bar */
        .header {
            background: linear-gradient(145deg, #14171d, #0d0e12);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header h1 span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        /* 3 Kolonlu Dashboard Layout (Boşlukları yok eden tam ekran ızgara) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 320px 1.2fr 1fr;
            gap: 16px;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 1100px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Genel Kutu Şablonu */
        .panel-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .panel-box h2 {
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        /* SOL PANEL: FatSecret Kalori & Makro */
        .calorie-gauge {
            background: #0a0b0e;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 14px;
        }

        .cal-num {
            font-size: 30px;
            font-weight: 900;
            color: #fff;
        }

        .cal-num span {
            font-size: 14px;
            color: var(--accent);
        }

        .progress-bar {
            height: 9px;
            background: #1f232c;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--gold));
            width: 0%;
            transition: width 0.3s ease;
        }

        .macro-row {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin-top: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .m-pill {
            flex: 1;
            padding: 6px 4px;
            border-radius: 8px;
            background: #14171d;
            text-align: center;
        }

        .food-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .food-item {
            background: #090a0d;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .food-item .fname {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .food-item .fcal {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .add-btn {
            background: #1a1e27;
            border: 1px solid #282f3d;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .add-btn:active {
            background: var(--accent);
            color: #000;
        }

        /* ORTA PANEL: Gerçekçi Medikal Kas Anatomisi & Flip */
        .anatomy-viewport {
            background: radial-gradient(circle at center, #1b1e26 0%, #090a0d 100%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            min-height: 520px;
        }

        .flip-body {
            width: 320px;
            height: 460px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .flip-body.flipped {
            transform: rotateY(180deg);
        }

        .body-side {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .body-side.back {
            transform: rotateY(180deg);
        }

        .med-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.9));
        }

        /* Kas Tıklama Noktaları (Hotspots) */
        .muscle-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .hotspot {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 107, 0, 0.5);
            background: rgba(255, 107, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s;
            animation: pulseDot 2s infinite ease-in-out;
        }

        .hotspot:hover,
        .hotspot.active {
            background: rgba(255, 107, 0, 0.7);
            border-color: #fff;
            box-shadow: 0 0 16px var(--accent);
            transform: scale(1.15);
        }

        @keyframes pulseDot {
            0% {
                transform: scale(1);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0.7;
            }
        }

        /* Anatomik Noktalar - Ön */
        .hs-chest {
            top: 22%;
            left: 40%;
            width: 65px;
            height: 35px;
            border-radius: 10px;
        }

        .hs-shoulders-l {
            top: 22%;
            left: 24%;
            width: 34px;
            height: 34px;
        }

        .hs-shoulders-r {
            top: 22%;
            left: 66%;
            width: 34px;
            height: 34px;
        }

        .hs-biceps-l {
            top: 24%;
            left: 14%;
            width: 32px;
            height: 38px;
            border-radius: 8px;
        }

        .hs-biceps-r {
            top: 24%;
            left: 78%;
            width: 32px;
            height: 38px;
            border-radius: 8px;
        }

        .hs-abs {
            top: 32%;
            left: 44%;
            width: 40px;
            height: 50px;
            border-radius: 8px;
        }

        .hs-quads-l {
            top: 48%;
            left: 38%;
            width: 36px;
            height: 75px;
            border-radius: 12px;
        }

        .hs-quads-r {
            top: 48%;
            left: 52%;
            width: 36px;
            height: 75px;
            border-radius: 12px;
        }

        /* Anatomik Noktalar - Arka */
        .hs-traps {
            top: 18%;
            left: 42%;
            width: 50px;
            height: 35px;
            border-radius: 10px;
        }

        .hs-lats {
            top: 26%;
            left: 38%;
            width: 75px;
            height: 45px;
            border-radius: 12px;
        }

        .hs-triceps-l {
            top: 24%;
            left: 14%;
            width: 34px;
            height: 40px;
            border-radius: 8px;
        }

        .hs-triceps-r {
            top: 24%;
            left: 78%;
            width: 34px;
            height: 40px;
            border-radius: 8px;
        }

        .hs-hams-l {
            top: 48%;
            left: 38%;
            width: 36px;
            height: 70px;
            border-radius: 12px;
        }

        .hs-hams-r {
            top: 48%;
            left: 52%;
            width: 36px;
            height: 70px;
            border-radius: 12px;
        }

        .hs-calves-l {
            top: 68%;
            left: 38%;
            width: 32px;
            height: 55px;
            border-radius: 10px;
        }

        .hs-calves-r {
            top: 68%;
            left: 54%;
            width: 32px;
            height: 55px;
            border-radius: 10px;
        }

        .flip-hint {
            position: absolute;
            bottom: 12px;
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        /* SAĞ PANEL: Egzersiz Listesi, Form & Kayıtlar */
        .exercise-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .ex-card {
            background: #090a0d;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ex-card:hover,
        .ex-card:active {
            border-color: var(--accent);
            background: #14171f;
        }

        .ex-card .title {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .ex-card .meta {
            font-size: 11px;
            color: var(--accent);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .full-row {
            grid-column: span 2;
        }

        input {
            width: 100%;
            background: #090a0d;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button.btn-primary {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        button.btn-primary:active {
            transform: scale(0.98);
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0c0d10;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent);
        }

        /* Video Modal */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }

        .modal-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <!-- Üst Başlık -->
    <div class="header">
        <h1>IRON<span>TRACK</span> PRO</h1>
        <div style="font-size:12px; font-weight:700; color:var(--accent);" id="navCalSummary">
            0 / 2500 KCAL
        </div>
    </div>

    <!-- 3 Kolonlu Dashboard Izgarası -->
    <div class="dashboard-grid">

        <!-- 1. KOLON: SOL FATSECRET KALORİ PANELİ -->
        <div class="panel-box">
            <h2>🥗 Kalori & Makro Takibi</h2>

            <div class="calorie-gauge">
                <div style="font-size:11px; color:var(--muted); font-weight:700;">GÜNLÜK HEDEF</div>
                <div class="cal-num"><span id="consumedCal">0</span> / 2500 <span>KCAL</span></div>

                <div class="progress-bar">
                    <div class="progress-fill" id="calProgress"></div>
                </div>

                <div class="macro-row">
                    <div class="m-pill" style="color:var(--protein);">P: <span id="protVal">0</span>g</div>
                    <div class="m-pill" style="color:var(--carb);">K: <span id="carbVal">0</span>g</div>
                    <div class="m-pill" style="color:var(--fat);">Y: <span id="fatVal">0</span>g</div>
                </div>
            </div>

            <h3 style="font-size:12px; color:var(--muted); text-transform:uppercase; margin-bottom:10px;">Fit Besin
                Kütüphanesi</h3>
            <div class="food-list" id="foodList"></div>

            <button class="add-btn" style="width:100%; margin-top:12px; padding:10px;" onclick="resetCalories()">Günü
                Sıfırla</button>
        </div>

        <!-- 2. KOLON: ORTA GERÇEKÇİ MEDİKAL ANATOMİ & 3D FLIP -->
        <div class="anatomy-viewport" onclick="flipBody(event)">
            <div class="flip-body" id="bodyCard">

                <!-- ÖN ANATOMİ -->
                <div class="body-side front">
                    <!-- Gerçekçi T-Pose Kas Lif Anatomisi -->
                    <svg viewBox="0 0 400 600" width="100%" height="100%" class="med-img">
                        <defs>
                            <linearGradient id="muscleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#a84328" />
                                <stop offset="50%" stop-color="#802817" />
                                <stop offset="100%" stop-color="#54150b" />
                            </linearGradient>
                            <linearGradient id="tendonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#e0dedb" />
                                <stop offset="100%" stop-color="#99948c" />
                            </linearGradient>
                        </defs>
                        <!-- Kafa & Yüz Lifleri -->
                        <path d="M185 85 C185 60, 215 60, 215 85 C215 105, 205 115, 200 115 C195 115, 185 105, 185 85 Z"
                            fill="url(#muscleGrad)" stroke="#380d07" />
                        <!-- Trapez & Boyun -->
                        <path d="M185 105 L215 105 L235 130 L165 130 Z" fill="url(#muscleGrad)" stroke="#380d07" />
                        <!-- Göğüs (Pectoralis Major) -->
                        <path d="M165 130 C185 125, 200 128, 200 155 C180 162, 165 158, 155 150 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" stroke-width="1.5" />
                        <path d="M235 130 C215 125, 200 128, 200 155 C220 162, 235 158, 245 150 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" stroke-width="1.5" />
                        <!-- Omuzlar (Deltoids) -->
                        <path d="M152 132 C135 136, 130 148, 138 162 C146 162, 154 154, 158 144 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <path d="M248 132 C265 136, 270 148, 262 162 C254 162, 246 154, 242 144 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <!-- Kollar (Biceps & Ön Kol) -->
                        <path d="M136 142 L65 148 L65 160 L134 162 Z" fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <path d="M264 142 L335 148 L335 160 L266 162 Z" fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <!-- Karın (Rectus Abdominis) -->
                        <path d="M178 160 L222 160 L216 230 L184 230 Z" fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <line x1="200" y1="160" x2="200" y2="230" stroke="url(#tendonGrad)" stroke-width="3" />
                        <!-- Bacaklar (Quadriceps) -->
                        <path
                            d="M174 240 C160 270, 158 330, 168 370 C180 370, 192 350, 195 300 C198 260, 194 242, 185 240 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <path
                            d="M226 240 C240 270, 242 330, 232 370 C220 370, 208 350, 205 300 C202 260, 206 242, 215 240 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <!-- Diz & Kaval Tendonları -->
                        <ellipse cx="178" cy="385" rx="8" ry="8" fill="url(#tendonGrad)" />
                        <ellipse cx="222" cy="385" rx="8" ry="8" fill="url(#tendonGrad)" />
                        <!-- Baldır (Calves) -->
                        <path d="M168 395 C160 430, 165 470, 172 490 L186 490 C190 460, 190 420, 184 395 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <path d="M232 395 C240 430, 235 470, 228 490 L214 490 C210 460, 210 420, 216 395 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                    </svg>

                    <div class="muscle-layer">
                        <div class="hotspot hs-chest active" onclick="selectMuscle('chest', event)" title="Göğüs"></div>
                        <div class="hotspot hs-shoulders-l" onclick="selectMuscle('shoulders', event)" title="Sol Omuz">
                        </div>
                        <div class="hotspot hs-shoulders-r" onclick="selectMuscle('shoulders', event)" title="Sağ Omuz">
                        </div>
                        <div class="hotspot hs-biceps-l" onclick="selectMuscle('biceps', event)" title="Sol Kol"></div>
                        <div class="hotspot hs-biceps-r" onclick="selectMuscle('biceps', event)" title="Sağ Kol"></div>
                        <div class="hotspot hs-abs" onclick="selectMuscle('abs', event)" title="Karın"></div>
                        <div class="hotspot hs-quads-l" onclick="selectMuscle('quads', event)" title="Sol Ön Bacak">
                        </div>
                        <div class="hotspot hs-quads-r" onclick="selectMuscle('quads', event)" title="Sağ Ön Bacak">
                        </div>
                    </div>
                </div>

                <!-- ARKA ANATOMİ -->
                <div class="body-side back">
                    <svg viewBox="0 0 400 600" width="100%" height="100%" class="med-img">
                        <!-- Arka Kafa -->
                        <path d="M185 85 C185 60, 215 60, 215 85 C215 105, 205 115, 200 115 C195 115, 185 105, 185 85 Z"
                            fill="url(#muscleGrad)" stroke="#380d07" />
                        <!-- Trapez & Boyun -->
                        <path d="M185 105 L215 105 L245 145 L200 180 L155 145 Z" fill="url(#muscleGrad)"
                            stroke="#2b0a05" />
                        <!-- Sırt & Kanat (Lats) -->
                        <path d="M155 145 C170 160, 185 170, 192 215 C175 210, 160 195, 150 170 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <path d="M245 145 C230 160, 215 170, 208 215 C225 210, 240 195, 250 170 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <!-- Kollar (Triceps) -->
                        <path d="M136 142 L65 148 L65 160 L134 162 Z" fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <path d="M264 142 L335 148 L335 160 L266 162 Z" fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <!-- Kalça (Glutes) -->
                        <path d="M172 230 C160 250, 165 285, 180 295 C195 295, 200 270, 200 235 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <path d="M228 230 C240 250, 235 285, 220 295 C205 295, 200 270, 200 235 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <!-- Arka Bacak (Hamstrings) -->
                        <path d="M172 300 C165 330, 165 355, 175 372 C186 372, 194 355, 196 310 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <path d="M228 300 C235 330, 235 355, 225 372 C214 372, 206 355, 204 310 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <!-- Arka Kalf -->
                        <path d="M166 395 C158 430, 162 470, 172 490 L186 490 C192 460, 192 420, 184 395 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                        <path d="M234 395 C242 430, 238 470, 228 490 L214 490 C208 460, 208 420, 216 395 Z"
                            fill="url(#muscleGrad)" stroke="#2b0a05" />
                    </svg>

                    <div class="muscle-layer">
                        <div class="hotspot hs-traps" onclick="selectMuscle('traps', event)" title="Trapez"></div>
                        <div class="hotspot hs-lats" onclick="selectMuscle('lats', event)" title="Kanat & Sırt"></div>
                        <div class="hotspot hs-triceps-l" onclick="selectMuscle('triceps', event)" title="Sol Arka Kol">
                        </div>
                        <div class="hotspot hs-triceps-r" onclick="selectMuscle('triceps', event)" title="Sağ Arka Kol">
                        </div>
                        <div class="hotspot hs-hams-l" onclick="selectMuscle('hamstrings', event)"
                            title="Sol Arka Bacak"></div>
                        <div class="hotspot hs-hams-r" onclick="selectMuscle('hamstrings', event)"
                            title="Sağ Arka Bacak"></div>
                        <div class="hotspot hs-calves-l" onclick="selectMuscle('calves', event)" title="Sol Kalf"></div>
                        <div class="hotspot hs-calves-r" onclick="selectMuscle('calves', event)" title="Sağ Kalf"></div>
                    </div>
                </div>

            </div>
            <div class="flip-hint">🔄 Vücudu çevirmek için dokun</div>
        </div>

        <!-- 3. KOLON: SAĞ EGZERSİZ, FORM & SET KAYITLARI -->
        <div class="panel-box">
            <h2 id="muscleTitle">🎯 GÖĞÜS (CHEST) HAREKETLERİ</h2>
            <div class="exercise-grid" id="exerciseGrid"></div>

            <form id="workoutForm" class="grid-form">
                <div class="full-row">
                    <input type="text" id="exerciseName" placeholder="Seçilen Hareket" required />
                </div>
                <div>
                    <input type="number" id="weight" placeholder="Ağırlık (kg)" step="0.5" required />
                </div>
                <div>
                    <input type="number" id="reps" placeholder="Tekrar" required />
                </div>
                <div class="full-row">
                    <input type="number" id="setNumber" placeholder="Set No" value="1" required />
                </div>
                <div class="full-row">
                    <button type="submit" class="btn-primary">Seti Kaydet</button>
                </div>
            </form>

            <h2 style="font-size:13px; margin-top:14px;">📋 Antrenman Kayıtları</h2>
            <div id="logsList" style="max-height: 220px; overflow-y: auto;">Yükleniyor...</div>
        </div>

    </div>

    <!-- Video Modal -->
    <div class="video-modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-header">
                <strong id="modalTitle" style="color:var(--accent);">Egzersiz Formu</strong>
                <button onclick="closeModal()"
                    style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer;">&times;</button>
            </div>
            <div class="video-wrapper">
                <iframe id="videoFrame" src="" allowfullscreen></iframe>
            </div>
            <div style="padding:12px;">
                <button class="btn-primary" onclick="useExerciseFromModal()">Bu Hareketi Antrenmana Seç</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/WorkoutLogs';

        /* 1. FATSECRET KALORİ MOTORU */
        const foods = [
            { name: "Izgara Tavuk Göğsü (150g)", cal: 247, p: 46, c: 0, f: 5 },
            { name: "Pirinç Pilavı (200g)", cal: 260, p: 5, c: 57, f: 1 },
            { name: "Yulaf & Muz (80g)", cal: 310, p: 10, c: 58, f: 5 },
            { name: "Haşlanmış Yumurta (3 Adet)", cal: 215, p: 18, c: 1, f: 15 },
            { name: "Izgara Köfte (160g)", cal: 340, p: 30, c: 4, f: 22 },
            { name: "Whey Protein (1 Ölçek)", cal: 120, p: 24, c: 2, f: 1.5 },
            { name: "Lor Peyniri (100g)", cal: 98, p: 12, c: 3, f: 4 }
        ];

        let nutrition = JSON.parse(localStorage.getItem('ironNutrition')) || { cal: 0, p: 0, c: 0, f: 0 };

        function renderFoods() {
            const list = document.getElementById('foodList');
            list.innerHTML = '';
            foods.forEach((f, idx) => {
                const item = document.createElement('div');
                item.className = 'food-item';
                item.innerHTML = `
                    <div>
                        <div class="fname">${f.name}</div>
                        <div class="fcal">${f.cal} kcal &bull; P:${f.p}g K:${f.c}g Y:${f.f}g</div>
                    </div>
                    <button class="add-btn" onclick="addFood(${idx})">+ Ekle</button>
                `;
                list.appendChild(item);
            });
            updateNutritionUI();
        }

        function addFood(idx) {
            const f = foods[idx];
            nutrition.cal += f.cal;
            nutrition.p += f.p;
            nutrition.c += f.c;
            nutrition.f += f.f;
            localStorage.setItem('ironNutrition', JSON.stringify(nutrition));
            updateNutritionUI();
        }

        function resetCalories() {
            nutrition = { cal: 0, p: 0, c: 0, f: 0 };
            localStorage.setItem('ironNutrition', JSON.stringify(nutrition));
            updateNutritionUI();
        }

        function updateNutritionUI() {
            document.getElementById('consumedCal').innerText = nutrition.cal;
            document.getElementById('protVal').innerText = nutrition.p;
            document.getElementById('carbVal').innerText = nutrition.c;
            document.getElementById('fatVal').innerText = nutrition.f;

            const pct = Math.min(100, Math.round((nutrition.cal / 2500) * 100));
            document.getElementById('calProgress').style.width = pct + '%';
            document.getElementById('navCalSummary').innerText = `${nutrition.cal} / 2500 KCAL`;
        }

        /* 2. MEDİKAL ANATOMİ & 3D FLIP */
        let isFlipped = false;
        function flipBody(e) {
            if (e.target.classList.contains('hotspot')) return;
            const body = document.getElementById('bodyCard');
            isFlipped = !isFlipped;
            if (isFlipped) body.classList.add('flipped');
            else body.classList.remove('flipped');
        }

        const muscleExercises = {
            chest: {
                title: "🎯 GÖĞÜS (CHEST) HAREKETLERİ",
                exercises: [
                    { name: "Barbell Bench Press", videoId: "rT7DgCr-3pg", meta: "Bileşik • Güç" },
                    { name: "Incline Dumbbell Press", videoId: "8iPEnn-ltC8", meta: "Üst Göğüs" },
                    { name: "Cable Fly", videoId: "Z57CtFmRMxA", meta: "İzolasyon" },
                    { name: "Dips", videoId: "2z8JmcrW-As", meta: "Alt Göğüs" }
                ]
            },
            shoulders: {
                title: "🎯 OMUZ (DELTOIDS) HAREKETLERİ",
                exercises: [
                    { name: "Overhead Barbell Press", videoId: "2yjwXTZQDDI", meta: "Güç" },
                    { name: "Lateral Raise", videoId: "3VcKaXpzqRo", meta: "Yan Omuz" },
                    { name: "Face Pull", videoId: "rep-qVOkqgk", meta: "Arka Omuz" }
                ]
            },
            biceps: {
                title: "🎯 BICEPS (KOL) HAREKETLERİ",
                exercises: [
                    { name: "Barbell Curl", videoId: "ykJmrZ5v0Oo", meta: "Kütle" },
                    { name: "Hammer Curl", videoId: "zC3nLlEvin4", meta: "Brachialis" }
                ]
            },
            triceps: {
                title: "🎯 TRICEPS (ARKA KOL) HAREKETLERİ",
                exercises: [
                    { name: "Triceps Pushdown", videoId: "vB5OHsJ3EME", meta: "İzolasyon" },
                    { name: "Skull Crusher", videoId: "d_KZxkH_toI", meta: "Kütle" }
                ]
            },
            abs: {
                title: "🎯 KARIN (CORE) HAREKETLERİ",
                exercises: [
                    { name: "Hanging Leg Raise", videoId: "hdng3Nm1x_E", meta: "Alt Karın" },
                    { name: "Cable Crunch", videoId: "pZapRXZcggU", meta: "Üst Karın" }
                ]
            },
            quads: {
                title: "🎯 ÖN BACAK (QUADRICEPS) HAREKETLERİ",
                exercises: [
                    { name: "Barbell Back Squat", videoId: "bEv6CCg2BC8", meta: "Bileşik • Güç" },
                    { name: "Leg Press", videoId: "IZxyjW7MPJQ", meta: "Hacim" }
                ]
            },
            lats: {
                title: "🎯 KANAT & SIRT (LATS) HAREKETLERİ",
                exercises: [
                    { name: "Barbell Row", videoId: "9efgc2TrvEg", meta: "Kalınlık" },
                    { name: "Lat Pulldown", videoId: "CAwf7n6Luuc", meta: "Genişlik" },
                    { name: "Deadlift", videoId: "op9kVnSso6Q", meta: "Tüm Sırt" }
                ]
            },
            traps: {
                title: "🎯 TRAPEZ HAREKETLERİ",
                exercises: [
                    { name: "Barbell Shrug", videoId: "g6qbq4Du13Q", meta: "Trapez" }
                ]
            },
            hamstrings: {
                title: "🎯 ARKA BACAK (HAMSTRINGS) HAREKETLERİ",
                exercises: [
                    { name: "Romanian Deadlift", videoId: "JCXUYuzwNrM", meta: "Gerilim" },
                    { name: "Lying Leg Curl", videoId: "ELOCsoDSmrg", meta: "İzolasyon" }
                ]
            },
            calves: {
                title: "🎯 BALDIR (CALVES) HAREKETLERİ",
                exercises: [
                    { name: "Standing Calf Raise", videoId: "-M4-G8p8fmc", meta: "Kalf" }
                ]
            }
        };

        function selectMuscle(key, event) {
            if (event) event.stopPropagation();
            document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('active'));
            if (event) event.target.classList.add('active');

            const data = muscleExercises[key];
            if (!data) return;
            document.getElementById('muscleTitle').innerText = data.title;

            const grid = document.getElementById('exerciseGrid');
            grid.innerHTML = '';
            data.exercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'ex-card';
                card.innerHTML = `
                    <div class="title">${ex.name}</div>
                    <div class="meta"><span>${ex.meta}</span><span>▶ Video</span></div>
                `;
                card.onclick = () => openVideo(ex.name, ex.videoId);
                grid.appendChild(card);
            });
        }

        let selectedExName = "";
        function openVideo(name, videoId) {
            selectedExName = name;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1`;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('videoFrame').src = '';
            document.getElementById('videoModal').style.display = 'none';
        }

        function useExerciseFromModal() {
            document.getElementById('exerciseName').value = selectedExName;
            closeModal();
        }

        /* 3. SET KAYITLARI & API */
        async function loadLogs() {
            const container = document.getElementById('logsList');
            try {
                const res = await fetch(API_URL);
                const logs = await res.json();
                container.innerHTML = '';
                if (logs.length === 0) {
                    container.innerHTML = '<p style="color:var(--muted); font-size:12px; text-align:center;">Henüz set kaydedilmedi.</p>';
                    return;
                }
                logs.forEach(log => {
                    const item = document.createElement('div');
                    item.className = 'log-item';
                    item.innerHTML = `
                        <div>
                            <strong style="font-size:13px; color:#fff;">${log.exerciseName}</strong> &bull; Set ${log.setNumber}
                            <div style="color:var(--accent); font-size:11px; font-weight:700;">${log.weight} KG &times; ${log.reps} Tekrar</div>
                        </div>
                        <button style="background:#1f1113; color:#ff4757; border:none; padding:5px 10px; border-radius:6px; font-size:11px; font-weight:700;" onclick="deleteLog(${log.id})">Sil</button>
                    `;
                    container.appendChild(item);
                });
            } catch (e) {
                container.innerHTML = '<p style="color:var(--muted); font-size:12px; text-align:center;">Kayıtlar listelenmeye hazır.</p>';
            }
        }

        document.getElementById('workoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const setInput = document.getElementById('setNumber');
            const cSet = parseInt(setInput.value) || 1;
            const payload = {
                exerciseName: document.getElementById('exerciseName').value,
                weight: parseFloat(document.getElementById('weight').value),
                reps: parseInt(document.getElementById('reps').value),
                setNumber: cSet
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('weight').value = '';
            document.getElementById('reps').value = '';
            setInput.value = cSet + 1;
            loadLogs();
        });

        async function deleteLog(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            loadLogs();
        }

        window.onload = () => {
            renderFoods();
            selectMuscle('chest');
            loadLogs();
        };
    </script>
</body>

</html>
