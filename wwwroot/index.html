<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IronTrack" />
    <title>IronTrack 3D Anatomy Pro</title>

    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #121316;
            --card-border: #1f2229;
            --accent: #ff6b00;
            --accent-hover: #ff8533;
            --accent-glow: rgba(255, 107, 0, 0.4);
            --gold: #ffa502;
            --text: #f5f6fa;
            --muted: #8a8f9d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
            padding-left: calc(env(safe-area-inset-left, 0px) + 14px);
            padding-right: calc(env(safe-area-inset-right, 0px) + 14px);
            min-height: 100vh;
        }

        .container {
            max-width: 620px;
            margin: 0 auto;
        }

        /* 3D Model Bölümü */
        .viewer-box {
            background: radial-gradient(circle at center, #1c1f26 0%, #0d0e11 100%);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 14px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        #canvas3d {
            width: 100%;
            height: 240px;
            display: block;
            touch-action: none;
            cursor: grab;
        }

        #canvas3d:active {
            cursor: grabbing;
        }

        .viewer-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: var(--muted);
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 12px;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Kas Seçim Hapları */
        .muscle-selector {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 10px 14px;
            background: #111216;
            border-bottom: 1px solid var(--card-border);
            scrollbar-width: none;
        }

        .muscle-selector::-webkit-scrollbar {
            display: none;
        }

        .m-tag {
            background: #191b22;
            border: 1px solid #282d38;
            padding: 7px 13px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 700;
            color: #b0b5c0;
            white-space: nowrap;
            cursor: pointer;
        }

        .m-tag.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Egzersiz Öneri Kartları */
        .box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .box h2 {
            font-size: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .exercise-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .ex-card {
            background: #090a0d;
            border: 1px solid #232732;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ex-card:hover,
        .ex-card:active {
            border-color: var(--accent);
            background: #15171e;
        }

        .ex-card .title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .ex-card .meta {
            font-size: 11px;
            color: var(--accent);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* Video Modal */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .modal-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Form */
        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .full-row {
            grid-column: span 2;
        }

        input {
            width: 100%;
            background: #090a0d;
            border: 1px solid #232732;
            border-radius: 10px;
            padding: 13px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button.btn-primary {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* Rest Timer Bar */
        .timer-bar {
            background: #14171d;
            border: 1px solid #282d38;
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0c0d10;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent);
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 3D Anatomi Görüntüleyici -->
        <div class="viewer-box">
            <div class="muscle-selector">
                <span class="m-tag active" onclick="selectMuscle('chest', this)">GÖĞÜS</span>
                <span class="m-tag" onclick="selectMuscle('back', this)">SIRT</span>
                <span class="m-tag" onclick="selectMuscle('shoulders', this)">OMUZ</span>
                <span class="m-tag" onclick="selectMuscle('biceps', this)">BICEPS</span>
                <span class="m-tag" onclick="selectMuscle('triceps', this)">TRICEPS</span>
                <span class="m-tag" onclick="selectMuscle('legs', this)">BACAK</span>
            </div>

            <canvas id="canvas3d"></canvas>
            <div class="viewer-hint">🔄 Döndürmek için kaydır</div>
        </div>

        <!-- Seçili Kas Hareketleri -->
        <div class="box">
            <h2 id="muscleTitle">🎯 GÖĞÜS HAREKETLERİ & FORM</h2>
            <div class="exercise-grid" id="exerciseGrid"></div>
        </div>

        <!-- Dinlenme Sayacı -->
        <div class="timer-bar">
            <div>
                <span style="font-size:11px; color:var(--muted); font-weight:700;">DİNLENME</span>
                <div style="font-size:20px; font-weight:900; color:var(--gold);" id="timer">01:30</div>
            </div>
            <div style="display:flex; gap:6px;">
                <button onclick="startTimer()"
                    style="background:#232732; border:none; color:#fff; padding:6px 12px; border-radius:6px; font-weight:700;">Başlat</button>
                <button onclick="resetTimer()"
                    style="background:#232732; border:none; color:#fff; padding:6px 12px; border-radius:6px; font-weight:700;">Sıfırla</button>
            </div>
        </div>

        <!-- Set Giriş Formu -->
        <div class="box">
            <h2>➕ Seti Kaydet</h2>
            <form id="workoutForm" class="grid-form">
                <div class="full-row">
                    <input type="text" id="exerciseName" placeholder="Seçilen Hareket" required />
                </div>
                <div>
                    <input type="number" id="weight" placeholder="Ağırlık (kg)" step="0.5" inputmode="decimal"
                        required />
                </div>
                <div>
                    <input type="number" id="reps" placeholder="Tekrar" inputmode="numeric" required />
                </div>
                <div class="full-row">
                    <input type="number" id="setNumber" placeholder="Set No" value="1" inputmode="numeric" required />
                </div>
                <div class="full-row">
                    <button type="submit" class="btn-primary">Seti Bas & Sayacı Başlat</button>
                </div>
            </form>
        </div>

        <!-- Kayıtlar -->
        <div class="box">
            <h2>📋 Antrenman Kayıtları</h2>
            <div id="logsList">Yükleniyor...</div>
        </div>

    </div>

    <!-- Video Modal Penceresi -->
    <div class="video-modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-header">
                <strong id="modalTitle" style="color:var(--accent);">Egzersiz Formu</strong>
                <button onclick="closeModal()"
                    style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">&times;</button>
            </div>
            <div class="video-wrapper">
                <iframe id="videoFrame" src="" allowfullscreen></iframe>
            </div>
            <div style="padding:12px;">
                <button class="btn-primary" onclick="useExerciseFromModal()">Bu Hareketi Antrenmana Seç</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/WorkoutLogs';

        // Kas Veritabanı ve Eğitim Videoları
        const muscleData = {
            chest: {
                title: "🎯 GÖĞÜS HAREKETLERİ",
                rotation: 0, // Öne bak
                targetMesh: "chest",
                exercises: [
                    { name: "Barbell Bench Press", videoId: "rT7DgCr-3pg", sets: "3-4 Set" },
                    { name: "Incline Dumbbell Press", videoId: "8iPEnn-ltC8", sets: "3-4 Set" },
                    { name: "Chest Fly (Cable/Dumbbell)", videoId: "Z57CtFmRMxA", sets: "3 Set" },
                    { name: "Dips (Göğüs Odaklı)", videoId: "2z8JmcrW-As", sets: "3 Set" }
                ]
            },
            back: {
                title: "🎯 SIRT HAREKETLERİ",
                rotation: Math.PI, // Arkaya bak
                targetMesh: "back",
                exercises: [
                    { name: "Barbell Bent-Over Row", videoId: "9efgc2TrvEg", sets: "4 Set" },
                    { name: "Lat Pulldown", videoId: "CAwf7n6Luuc", sets: "3-4 Set" },
                    { name: "Seated Cable Row", videoId: "GZbfZ033f74", sets: "3 Set" },
                    { name: "Deadlift", videoId: "op9kVnSso6Q", sets: "3-5 Set" }
                ]
            },
            shoulders: {
                title: "🎯 OMUZ HAREKETLERİ",
                rotation: 0,
                targetMesh: "shoulders",
                exercises: [
                    { name: "Overhead Barbell Press", videoId: "2yjwXTZQDDI", sets: "4 Set" },
                    { name: "Dumbbell Lateral Raise", videoId: "3VcKaXpzqRo", sets: "4 Set" },
                    { name: "Face Pull", videoId: "rep-qVOkqgk", sets: "3-4 Set" },
                    { name: "Reverse Pec Deck", videoId: "6yMdhi2DVao", sets: "3 Set" }
                ]
            },
            biceps: {
                title: "🎯 BICEPS HAREKETLERİ",
                rotation: 0,
                targetMesh: "arms",
                exercises: [
                    { name: "Barbell Curl", videoId: "ykJmrZ5v0Oo", sets: "3-4 Set" },
                    { name: "Incline Dumbbell Curl", videoId: "soxrZlIl35U", sets: "3 Set" },
                    { name: "Hammer Curl", videoId: "zC3nLlEvin4", sets: "3 Set" }
                ]
            },
            triceps: {
                title: "🎯 TRICEPS HAREKETLERİ",
                rotation: Math.PI,
                targetMesh: "arms",
                exercises: [
                    { name: "Triceps Rope Pushdown", videoId: "vB5OHsJ3EME", sets: "3-4 Set" },
                    { name: "Skull Crusher", videoId: "d_KZxkH_toI", sets: "3 Set" },
                    { name: "Overhead Dumbbell Extension", videoId: "nRiJVZDpdL0", sets: "3 Set" }
                ]
            },
            legs: {
                title: "🎯 BACAK HAREKETLERİ",
                rotation: 0,
                targetMesh: "legs",
                exercises: [
                    { name: "Barbell Squat", videoId: "bEv6CCg2BC8", sets: "4 Set" },
                    { name: "Leg Press", videoId: "IZxyjW7MPJQ", sets: "3-4 Set" },
                    { name: "Romanian Deadlift", videoId: "JCXUYuzwNrM", sets: "3-4 Set" },
                    { name: "Leg Extension / Curl", videoId: "m0FOpMEgero", sets: "3 Set" }
                ]
            }
        };

        let selectedExName = "";

        /* ================= 3D THREE.JS MOTORU ================= */
        let scene, camera, renderer, mannequin;
        let meshes = {};
        let isDragging = false;
        let prevMouseX = 0;
        let targetRotationY = 0;

        function init3D() {
            const canvas = document.getElementById('canvas3d');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(40, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
            camera.position.set(0, 1.2, 4.2);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Işıklar
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xff6b00, 1.2);
            dirLight.position.set(2, 4, 3);
            scene.add(dirLight);

            // Manken Grubu
            mannequin = new THREE.Group();

            const matBase = new THREE.MeshStandardMaterial({ color: 0x222630, roughness: 0.5 });
            const matAccent = new THREE.MeshStandardMaterial({ color: 0xff6b00, roughness: 0.3, emissive: 0x552200 });

            // Baş
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), matBase);
            head.position.y = 1.9;
            mannequin.add(head);

            // Göğüs
            meshes.chest = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.35, 0.3), matAccent);
            meshes.chest.position.set(0, 1.5, 0.05);
            mannequin.add(meshes.chest);

            // Sırt
            meshes.back = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.45, 0.15), matBase);
            meshes.back.position.set(0, 1.45, -0.08);
            mannequin.add(meshes.back);

            // Omuzlar
            const shoulderGeo = new THREE.SphereGeometry(0.14, 16, 16);
            meshes.shoulderL = new THREE.Mesh(shoulderGeo, matBase);
            meshes.shoulderL.position.set(-0.38, 1.6, 0);
            meshes.shoulderR = new THREE.Mesh(shoulderGeo, matBase);
            meshes.shoulderR.position.set(0.38, 1.6, 0);
            mannequin.add(meshes.shoulderL, meshes.shoulderR);

            // Kollar
            const armGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.5, 12);
            meshes.armL = new THREE.Mesh(armGeo, matBase);
            meshes.armL.position.set(-0.42, 1.2, 0);
            meshes.armR = new THREE.Mesh(armGeo, matBase);
            meshes.armR.position.set(0.42, 1.2, 0);
            mannequin.add(meshes.armL, meshes.armR);

            // Bel
            const abs = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.3, 0.25), matBase);
            abs.position.set(0, 1.15, 0);
            mannequin.add(abs);

            // Bacaklar
            const legGeo = new THREE.CylinderGeometry(0.11, 0.09, 0.8, 12);
            meshes.legL = new THREE.Mesh(legGeo, matBase);
            meshes.legL.position.set(-0.16, 0.6, 0);
            meshes.legR = new THREE.Mesh(legGeo, matBase);
            meshes.legR.position.set(0.16, 0.6, 0);
            mannequin.add(meshes.legL, meshes.legR);

            mannequin.position.y = -0.7;
            scene.add(mannequin);

            // Dokunmatik ve Fare Kontrolleri
            canvas.addEventListener('pointerdown', (e) => {
                isDragging = true;
                prevMouseX = e.clientX;
            });
            window.addEventListener('pointerup', () => isDragging = false);
            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const delta = e.clientX - prevMouseX;
                mannequin.rotation.y += delta * 0.015;
                targetRotationY = mannequin.rotation.y;
                prevMouseX = e.clientX;
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            // Yumuşak dönüş geçişi
            if (!isDragging) {
                mannequin.rotation.y += (targetRotationY - mannequin.rotation.y) * 0.08;
            }
            renderer.render(scene, camera);
        }

        /* Kas Seçildiğinde 3D Modeli Vurgula */
        function highlightMesh(group) {
            const defaultMat = new THREE.MeshStandardMaterial({ color: 0x222630, roughness: 0.5 });
            const activeMat = new THREE.MeshStandardMaterial({ color: 0xff6b00, roughness: 0.2, emissive: 0x662200 });

            meshes.chest.material = defaultMat;
            meshes.back.material = defaultMat;
            meshes.shoulderL.material = defaultMat;
            meshes.shoulderR.material = defaultMat;
            meshes.armL.material = defaultMat;
            meshes.armR.material = defaultMat;
            meshes.legL.material = defaultMat;
            meshes.legR.material = defaultMat;

            if (group === 'chest') meshes.chest.material = activeMat;
            if (group === 'back') meshes.back.material = activeMat;
            if (group === 'shoulders') { meshes.shoulderL.material = activeMat; meshes.shoulderR.material = activeMat; }
            if (group === 'biceps' || group === 'triceps') { meshes.armL.material = activeMat; meshes.armR.material = activeMat; }
            if (group === 'legs') { meshes.legL.material = activeMat; meshes.legR.material = activeMat; }
        }

        function selectMuscle(key, el) {
            document.querySelectorAll('.m-tag').forEach(t => t.classList.remove('active'));
            if (el) el.classList.add('active');

            const data = muscleData[key];
            document.getElementById('muscleTitle').innerText = data.title;
            targetRotationY = data.rotation;
            highlightMesh(key);

            // Egzersizleri Listele
            const grid = document.getElementById('exerciseGrid');
            grid.innerHTML = '';
            data.exercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'ex-card';
                card.innerHTML = `
                    <div class="title">${ex.name}</div>
                    <div class="meta"><span>${ex.sets}</span><span>▶ Video</span></div>
                `;
                card.onclick = () => openVideo(ex.name, ex.videoId);
                grid.appendChild(card);
            });
        }

        /* Modal & Video */
        function openVideo(name, videoId) {
            selectedExName = name;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1`;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('videoFrame').src = '';
            document.getElementById('videoModal').style.display = 'none';
        }

        function useExerciseFromModal() {
            document.getElementById('exerciseName').value = selectedExName;
            closeModal();
            window.scrollTo({ top: document.getElementById('workoutForm').offsetTop - 20, behavior: 'smooth' });
        }

        /* Timer */
        let tSec = 90, tInt = null;
        function updateT() {
            const m = Math.floor(tSec / 60), s = tSec % 60;
            document.getElementById('timer').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        function startTimer() {
            clearInterval(tInt);
            tInt = setInterval(() => {
                if (tSec > 0) { tSec--; updateT(); }
                else clearInterval(tInt);
            }, 1000);
        }
        function resetTimer() { clearInterval(tInt); tSec = 90; updateT(); }

        /* API Veri İletişimi */
        async function loadLogs() {
            const container = document.getElementById('logsList');
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error();
                const logs = await res.json();
                container.innerHTML = '';
                if (logs.length === 0) {
                    container.innerHTML = '<p style="color:var(--muted); font-size:13px; text-align:center;">Henüz set girilmedi.</p>';
                    return;
                }
                logs.forEach(log => {
                    const item = document.createElement('div');
                    item.className = 'log-item';
                    item.innerHTML = `
                        <div>
                            <strong>${log.exerciseName}</strong> &bull; Set ${log.setNumber}
                            <div style="color:var(--accent); font-size:12px; font-weight:700;">${log.weight} KG &times; ${log.reps} Tekrar</div>
                        </div>
                        <button style="background:#1f1113; color:#ff4757; border:none; padding:6px 12px; border-radius:6px; font-weight:700;" onclick="deleteLog(${log.id})">Sil</button>
                    `;
                    container.appendChild(item);
                });
            } catch (e) {
                container.innerHTML = '<p style="color:#888; font-size:13px; text-align:center;">API hazır.</p>';
            }
        }

        document.getElementById('workoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const setInput = document.getElementById('setNumber');
            const cSet = parseInt(setInput.value) || 1;
            const payload = {
                exerciseName: document.getElementById('exerciseName').value,
                weight: parseFloat(document.getElementById('weight').value),
                reps: parseInt(document.getElementById('reps').value),
                setNumber: cSet
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('weight').value = '';
            document.getElementById('reps').value = '';
            setInput.value = cSet + 1;
            resetTimer();
            startTimer();
            loadLogs();
        });

        async function deleteLog(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            loadLogs();
        }

        window.onload = () => {
            init3D();
            selectMuscle('chest', document.querySelector('.m-tag'));
            loadLogs();
        };
    </script>
</body>

</html>
