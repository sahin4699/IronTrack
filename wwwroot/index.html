<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0f" />
    <title>IronTruck Pro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg: #08090d;
            --surface: #10121a;
            --surface-card: #151824;
            --border: #202536;
            --accent: #ff5e00;
            --accent-glow: rgba(255, 94, 0, 0.4);
            --gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #8e98ab;
            --protein: #10b981;
            --carb: #3b82f6;
            --fat: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-toggle-btn {
            background: #1c2130;
            border: 1px solid #2e364f;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-toggle-btn:active {
            background: var(--accent);
            color: #000;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .header h1 span {
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        /* SOL AÇILIR MENÜ (DRAWER) */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -380px;
            width: 360px;
            max-width: 88vw;
            height: 100vh;
            background: #0d0f16;
            border-right: 1px solid var(--border);
            z-index: 1001;
            padding: 20px 16px;
            overflow-y: auto;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .drawer-overlay.open .drawer {
            transform: translateX(380px);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
        }

        .drawer-tabs {
            display: flex;
            background: #151824;
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 14px;
            gap: 3px;
        }

        .d-tab {
            flex: 1;
            text-align: center;
            padding: 8px 4px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .d-tab.active {
            background: var(--accent);
            color: #000;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* Dairesel Canlı Adımsayar */
        .step-circle-box {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 14px;
        }

        .ring-box {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .ring-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring-bg {
            fill: none;
            stroke: #1e2230;
            stroke-width: 12;
        }

        .ring-bar {
            fill: none;
            stroke: var(--accent);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            transition: stroke-dashoffset 0.4s ease;
        }

        .ring-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ring-text .count {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
        }

        .step-info-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin-top: 12px;
        }

        .step-info-card {
            background: #0b0c10;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
        }

        .step-info-card .val {
            font-size: 14px;
            font-weight: 800;
            color: var(--gold);
        }

        .step-btns {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 10px;
        }

        .btn-sensor {
            flex: 1;
            background: #1c2130;
            border: 1px solid #2e364f;
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Besin Kartları */
        .cal-box {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: center;
        }

        .macro-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }

        .macro-pill {
            background: #0b0c10;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 5px 4px;
            text-align: center;
        }

        .food-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .food-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .food-img {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            background: #1b1e2b;
        }

        .food-info {
            flex: 1;
        }

        .food-info .name {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .food-info .cal {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .btn-add-food {
            background: #1e2436;
            border: 1px solid #2b344d;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* PR Rozeti ve Kartı */
        .pr-result-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 94, 0, 0.08);
            border: 1px dashed var(--accent);
            color: var(--accent);
            text-align: center;
            font-size: 13px;
            font-weight: 700;
        }

        /* ANA EKRAN DÜZENİ */
        .main-container {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        /* Anatomi & Flip */
        .anatomy-viewport {
            background: radial-gradient(circle at center, #161924 0%, #090a0e 100%);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            perspective: 900px;
        }

        .flip-stage {
            width: 300px;
            height: 460px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .flip-stage.flipped {
            transform: rotateY(180deg);
        }

        .body-card {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .body-card.back {
            transform: rotateY(180deg);
        }

        .anatomy-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.9));
        }

        .hotspot-node {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 94, 0, 0.8);
            background: rgba(255, 94, 0, 0.2);
            cursor: pointer;
            animation: pulseWave 2s infinite ease-in-out;
        }

        .hotspot-node.active {
            background: var(--accent);
            border-color: #fff;
            box-shadow: 0 0 15px var(--accent);
        }

        @keyframes pulseWave {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0.8;
            }
        }

        .hs-chest {
            top: 21%;
            left: 37%;
            width: 85px;
            height: 42px;
            border-radius: 8px;
        }

        .hs-shoulder-l {
            top: 19%;
            left: 21%;
            width: 34px;
            height: 34px;
        }

        .hs-shoulder-r {
            top: 19%;
            left: 69%;
            width: 34px;
            height: 34px;
        }

        .hs-biceps-l {
            top: 23%;
            left: 10%;
            width: 32px;
            height: 40px;
            border-radius: 8px;
        }

        .hs-biceps-r {
            top: 23%;
            left: 80%;
            width: 32px;
            height: 40px;
            border-radius: 8px;
        }

        .hs-abs {
            top: 31%;
            left: 41%;
            width: 56px;
            height: 60px;
            border-radius: 8px;
        }

        .hs-quads-l {
            top: 48%;
            left: 35%;
            width: 42px;
            height: 85px;
            border-radius: 12px;
        }

        .hs-quads-r {
            top: 48%;
            left: 52%;
            width: 42px;
            height: 85px;
            border-radius: 12px;
        }

        .hs-traps {
            top: 17%;
            left: 39%;
            width: 70px;
            height: 35px;
            border-radius: 8px;
        }

        .hs-lats {
            top: 24%;
            left: 35%;
            width: 95px;
            height: 50px;
            border-radius: 12px;
        }

        .hs-triceps-l {
            top: 23%;
            left: 10%;
            width: 32px;
            height: 40px;
            border-radius: 8px;
        }

        .hs-triceps-r {
            top: 23%;
            left: 80%;
            width: 32px;
            height: 40px;
            border-radius: 8px;
        }

        .hs-hams-l {
            top: 48%;
            left: 35%;
            width: 42px;
            height: 85px;
            border-radius: 12px;
        }

        .hs-hams-r {
            top: 48%;
            left: 52%;
            width: 42px;
            height: 85px;
            border-radius: 12px;
        }

        .hs-calves-l {
            top: 68%;
            left: 36%;
            width: 36px;
            height: 65px;
            border-radius: 10px;
        }

        .hs-calves-r {
            top: 68%;
            left: 53%;
            width: 36px;
            height: 65px;
            border-radius: 10px;
        }

        .flip-indicator {
            position: absolute;
            bottom: 12px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            background: rgba(16, 18, 26, 0.8);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
        }

        /* Egzersiz Listesi & Form */
        .exercise-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .exercise-item {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
        }

        .exercise-item:hover {
            border-color: var(--accent);
        }

        .exercise-item .name {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .exercise-item .meta {
            font-size: 10px;
            color: var(--accent);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        .workout-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .full-span {
            grid-column: span 2;
        }

        input {
            width: 100%;
            background: #0b0c10;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .log-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent);
        }

        /* Modal */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .modal-head {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .video-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <!-- SOL AÇILIR MENÜ (DRAWER: KALORİ / PR / ADIMSAYAR) -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer(event)">
        <div class="drawer" onclick="event.stopPropagation()">
            <div class="drawer-header">
                <div style="font-size: 14px; font-weight: 800; color: var(--accent);"><i
                        class="fa-solid fa-sliders"></i> KONTROL PANELİ</div>
                <button onclick="toggleDrawer()"
                    style="background:none; border:none; color:var(--text-muted); font-size:20px; cursor:pointer;">&times;</button>
            </div>

            <!-- Sekme Butonları -->
            <div class="drawer-tabs">
                <div class="d-tab active" onclick="switchDrawerTab('cal', this)"><i class="fa-solid fa-utensils"></i>
                    Kalori</div>
                <div class="d-tab" onclick="switchDrawerTab('pr', this)"><i class="fa-solid fa-trophy"></i> PR Sorgula
                </div>
                <div class="d-tab" onclick="switchDrawerTab('steps', this)"><i class="fa-solid fa-shoe-prints"></i>
                    Adımlar</div>
            </div>

            <!-- 1. SEKME: KALORİ & BESİNLER -->
            <div class="tab-panel active" id="tabCal">
                <div class="cal-box">
                    <div style="font-size: 20px; font-weight: 800;"><span id="calVal">0</span> <span
                            style="font-size: 11px; color: var(--text-muted);">/ 2500 KCAL</span></div>
                    <div class="macro-row">
                        <div class="macro-pill">
                            <div style="font-size:9px; color:var(--protein); font-weight:700;">P</div>
                            <div style="font-size:12px; font-weight:800;" id="pVal">0g</div>
                        </div>
                        <div class="macro-pill">
                            <div style="font-size:9px; color:var(--carb); font-weight:700;">K</div>
                            <div style="font-size:12px; font-weight:800;" id="cVal">0g</div>
                        </div>
                        <div class="macro-pill">
                            <div style="font-size:9px; color:var(--fat); font-weight:700;">Y</div>
                            <div style="font-size:12px; font-weight:800;" id="fVal">0g</div>
                        </div>
                    </div>
                </div>
                <div class="food-list" id="foodContainer"></div>
                <button onclick="resetCalories()"
                    style="width:100%; margin-top:10px; background:#1c2130; border:1px solid #2e364f; color:#fff; padding:8px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer;">Günü
                    Sıfırla</button>
            </div>

            <!-- 2. SEKME: PR (KİŞİSEL REKOR) -->
            <div class="tab-panel" id="tabPr">
                <div style="display:flex; gap:8px; margin-bottom:10px;">
                    <input type="text" id="prQueryInput" placeholder="Hareket (Örn: Bench Press)" />
                    <button class="btn-submit" style="width:90px; padding:0;" onclick="checkPR()">Bul</button>
                </div>
                <div id="prResultBox" class="pr-result-box"></div>
            </div>

            <!-- 3. SEKME: CANLI ADIMSAYAR -->
            <div class="tab-panel" id="tabSteps">
                <div class="step-circle-box">
                    <div class="ring-box">
                        <svg class="ring-svg" viewBox="0 0 160 160">
                            <circle class="ring-bg" cx="80" cy="80" r="70" />
                            <circle class="ring-bar" id="stepBar" cx="80" cy="80" r="70" />
                        </svg>
                        <div class="ring-text">
                            <div class="count" id="stepCountDisplay">0</div>
                            <div style="font-size:10px; color:var(--text-muted); font-weight:700;">/ 10.000 ADIM</div>
                        </div>
                    </div>
                    <div class="step-info-row">
                        <div class="step-info-card">
                            <div style="font-size:9px; color:var(--text-muted); font-weight:700;">🔥 YAKILAN</div>
                            <div class="val" id="burnedCalDisplay">0.0 kcal</div>
                        </div>
                        <div class="step-info-card">
                            <div style="font-size:9px; color:var(--text-muted); font-weight:700;">📍 MESAFE</div>
                            <div class="val" id="distanceDisplay">0.00 km</div>
                        </div>
                    </div>
                    <div class="step-btns">
                        <button class="btn-sensor" id="sensorBtn" onclick="toggleSensor()"><i
                                class="fa-solid fa-play"></i> Başlat</button>
                        <button class="btn-sensor" onclick="addManualSteps(50)"><i class="fa-solid fa-plus"></i>
                            +50</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <button class="menu-toggle-btn" onclick="toggleDrawer()"><i class="fa-solid fa-bars"></i></button>
            <h1>IRON<span>TRUCK</span> PRO</h1>
        </div>
        <div style="font-size: 13px; font-weight: 700; color: var(--accent);" id="headerCal">0 / 2500 KCAL</div>
    </header>

    <!-- ANA ANTRENMAN EKRANI -->
    <main class="main-container">

        <!-- 1. SÜTUN: MEDİKAL KAS ANATOMİSİ -->
        <section class="anatomy-viewport" onclick="flipBody(event)">
            <div class="flip-stage" id="stageCard">

                <!-- ÖN ANATOMİ -->
                <div class="body-card">
                    <svg class="anatomy-svg" viewBox="0 0 300 480">
                        <defs>
                            <linearGradient id="mf" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#99261a" />
                                <stop offset="100%" stop-color="#5a130c" />
                            </linearGradient>
                            <linearGradient id="tf" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#cbd5e1" />
                                <stop offset="100%" stop-color="#64748b" />
                            </linearGradient>
                        </defs>
                        <ellipse cx="150" cy="45" rx="20" ry="24" fill="url(#mf)" stroke="#380d07" />
                        <path d="M138 68 L162 68 L176 90 L124 90 Z" fill="url(#mf)" />
                        <path d="M125 90 C140 85, 150 88, 150 114 C134 120, 122 116, 115 110 Z" fill="url(#mf)"
                            stroke="#220603" stroke-width="1.5" />
                        <path d="M175 90 C160 85, 150 88, 150 114 C166 120, 178 116, 185 110 Z" fill="url(#mf)"
                            stroke="#220603" stroke-width="1.5" />
                        <circle cx="106" cy="98" r="15" fill="url(#mf)" />
                        <circle cx="194" cy="98" r="15" fill="url(#mf)" />

                <div class="body-card back">

                    <div class="hotspot-node hs-hams-l" onclick="pickMuscle('hamstrings', event)"
                        title="Sol Arka Bacak"></div>
                    <div class="hotspot-node hs-hams-r" onclick="pickMuscle('hamstrings', event)"
                        title="Sağ Arka Bacak"></div>
                    <div class="hotspot-node hs-calves-l" onclick="pickMuscle('calves', event)" title="Sol Kalf"></div>
                    <div class="hotspot-node hs-calves-r" onclick="pickMuscle('calves', event)" title="Sağ Kalf"></div>

            </div>
            <div class="flip-indicator"><i class="fa-solid fa-arrows-rotate"></i> Vücudu çevirmek için dokun</div>
        </section>

        <!-- 2. SÜTUN: HAREKETLER & SET KAYDI -->
        <section class="panel">
            <div style="font-size:14px; font-weight:700; text-transform:uppercase; margin-bottom:12px;"
                id="activeMuscleTitle"><i class="fa-solid fa-fire" style="color:var(--accent);"></i> Göğüs (Chest)
                Egzersizleri</div>
            <div class="exercise-grid" id="exerciseGrid"></div>

            <form id="workoutForm" class="workout-form">
                <div class="full-span">
                    <input type="text" id="exerciseName" placeholder="Seçilen Egzersiz" required />
                </div>
                <div>
                    <input type="number" id="weight" placeholder="Ağırlık (kg)" step="0.5" required />
                </div>
                <div>
                    <input type="number" id="reps" placeholder="Tekrar" required />
                </div>
                <div class="full-span">
                    <input type="number" id="setNumber" placeholder="Set No" value="1" required />
                </div>
                <div class="full-span">
                    <button type="submit" class="btn-submit">Seti Kaydet</button>
                </div>
            </form>

            <div style="font-size:13px; font-weight:700; text-transform:uppercase; margin-top:12px; margin-bottom:8px;">
                <i class="fa-solid fa-list-check" style="color:var(--accent);"></i> Antrenman Kayıtları</div>
            <div id="logsList" style="max-height: 220px; overflow-y: auto;">Kayıtlar yükleniyor...</div>
        </section>

    </main>

    <!-- Video Modal -->
    <div class="modal-backdrop" id="videoModal">
        <div class="modal-box">
            <div class="modal-head">
                <strong id="modalTitle" style="color:var(--accent);">Form Videosu</strong>
                <button onclick="closeModal()"
                    style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">&times;</button>
            </div>
            <div class="video-box">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>
            <div style="padding:12px;">
                <button class="btn-submit" onclick="selectFromModal()">Bu Hareketi Antrenmana Seç</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/WorkoutLogs';

        /* DRAWER KONTROLÜ */
        function toggleDrawer() {
            document.getElementById('drawerOverlay').classList.toggle('open');
        }

        function closeDrawer(e) {
            if (e.target.id === 'drawerOverlay') toggleDrawer();
        }

        function switchDrawerTab(tabName, el) {
            document.querySelectorAll('.d-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            el.classList.add('active');

            if (tabName === 'cal') document.getElementById('tabCal').classList.add('active');
            if (tabName === 'pr') document.getElementById('tabPr').classList.add('active');
            if (tabName === 'steps') document.getElementById('tabSteps').classList.add('active');
        }

        /* 1. PR SORGULAMA */
        async function checkPR() {
            const name = document.getElementById('prQueryInput').value.trim();
            const box = document.getElementById('prResultBox');
            if (!name) return;

            try {
                const res = await fetch(`${API_URL}/pr/${encodeURIComponent(name)}`);
                box.style.display = 'block';
                if (res.status === 404) {
                    box.style.borderColor = '#333';
                    box.style.color = '#888';
                    box.innerText = `${name} için henüz rekor yok.`;
                    return;
                }
                const data = await res.json();
                box.style.borderColor = 'var(--accent)';
                box.style.color = 'var(--accent)';
                box.innerHTML = `🏆 <strong>${data.exercise}</strong> PR: <strong>${data.maxWeight} KG</strong>`;
            } catch (e) {
                box.style.display = 'block';
                box.innerText = "Sorgu başarısız.";
            }
        }

        /* 2. CANLI ADIMSAYAR */
        let stepCount = parseInt(localStorage.getItem('ironTruckSteps')) || 0;
        let sensorActive = false;
        let lastStepTime = 0;

        function updateStepDisplay() {
            document.getElementById('stepCountDisplay').innerText = stepCount.toLocaleString();
            const burned = (stepCount * 0.04).toFixed(1);
            const dist = ((stepCount * 0.75) / 1000).toFixed(2);
            document.getElementById('burnedCalDisplay').innerText = `${burned} kcal`;
            document.getElementById('distanceDisplay').innerText = `${dist} km`;

            const offset = 440 - (Math.min(1, stepCount / 10000) * 440);
            document.getElementById('stepBar').style.strokeDashoffset = offset;
            localStorage.setItem('ironTruckSteps', stepCount);
        }

        function handleMotion(e) {
            const acc = e.accelerationIncludingGravity || e.acceleration;
            if (!acc || acc.x === null) return;
            const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
            const now = Date.now();
            if (mag > 11.5 && (now - lastStepTime > 330)) {
                stepCount++;
                lastStepTime = now;
                updateStepDisplay();
            }
        }

        async function toggleSensor() {
            const btn = document.getElementById('sensorBtn');
            if (!sensorActive) {
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    try {
                        const perm = await DeviceMotionEvent.requestPermission();
                        if (perm !== 'granted') return;
                    } catch (err) { }
                }
                window.addEventListener('devicemotion', handleMotion);
                sensorActive = true;
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> Duraklat';
                btn.style.background = 'var(--accent)';
                btn.style.color = '#000';
            } else {
                window.removeEventListener('devicemotion', handleMotion);
                sensorActive = false;
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Başlat';
                btn.style.background = '#1c2130';
                btn.style.color = '#fff';
            }
        }

        function addManualSteps(n) {
            stepCount += n;
            updateStepDisplay();
        }

        /* 3. BESİNLER & KALORİ */
        const foods = [
            { name: "Izgara Tavuk Göğsü (150g)", cal: 247, p: 46, c: 0, f: 5, img: "https://images.pexels.com/photos/6210876/pexels-photo-6210876.jpeg?auto=compress&cs=tinysrgb&w=150" },
            { name: "Beyaz Pirinç Pilavı (200g)", cal: 260, p: 5, c: 57, f: 1, img: "https://images.pexels.com/photos/723198/pexels-photo-723198.jpeg?auto=compress&cs=tinysrgb&w=150" },
            { name: "Fitness Yulaf Kasesi (80g)", cal: 310, p: 10, c: 58, f: 5, img: "https://images.pexels.com/photos/103124/pexels-photo-103124.jpeg?auto=compress&cs=tinysrgb&w=150" },
            { name: "Haşlanmış Yumurta (3 Adet)", cal: 215, p: 18, c: 1, f: 15, img: "https://images.pexels.com/photos/566566/pexels-photo-566566.jpeg?auto=compress&cs=tinysrgb&w=150" },
            { name: "Döküm Izgara Köfte (160g)", cal: 340, p: 30, c: 4, f: 22, img: "https://images.pexels.com/photos/2233729/pexels-photo-2233729.jpeg?auto=compress&cs=tinysrgb&w=150" },
            { name: "Çikolatalı Whey Shake", cal: 120, p: 24, c: 2, f: 1.5, img: "https://images.pexels.com/photos/3738730/pexels-photo-3738730.jpeg?auto=compress&cs=tinysrgb&w=150" },
            { name: "Taze Lor Peyniri (100g)", cal: 98, p: 12, c: 3, f: 4, img: "https://images.pexels.com/photos/4198019/pexels-photo-4198019.jpeg?auto=compress&cs=tinysrgb&w=150" }
        ];

        let nutrition = JSON.parse(localStorage.getItem('ironTruckNutrition')) || { cal: 0, p: 0, c: 0, f: 0 };

        function renderFoods() {
            const container = document.getElementById('foodContainer');
            container.innerHTML = '';
            foods.forEach((f, i) => {
                const div = document.createElement('div');
                div.className = 'food-card';
                div.innerHTML = `
                    <img src="${f.img}" alt="${f.name}" class="food-img" loading="lazy" />
                    <div class="food-info">
                        <div class="name">${f.name}</div>
                        <div class="cal">${f.cal} kcal &bull; P:${f.p}g K:${f.c}g Y:${f.f}g</div>
                    </div>
                    <button class="btn-add-food" onclick="addFoodItem(${i})"><i class="fa-solid fa-plus"></i></button>
                `;
                container.appendChild(div);
            });
            updateCalUI();
        }

        function addFoodItem(i) {
            const item = foods[i];
            nutrition.cal += item.cal;
            nutrition.p += item.p;
            nutrition.c += item.c;
            nutrition.f += item.f;
            localStorage.setItem('ironTruckNutrition', JSON.stringify(nutrition));
            updateCalUI();
        }

        function resetCalories() {
            nutrition = { cal: 0, p: 0, c: 0, f: 0 };
            localStorage.setItem('ironTruckNutrition', JSON.stringify(nutrition));
            updateCalUI();
        }

        function updateCalUI() {
            document.getElementById('calVal').innerText = nutrition.cal;
            document.getElementById('pVal').innerText = `${nutrition.p}g`;
            document.getElementById('cVal').innerText = `${nutrition.c}g`;
            document.getElementById('fVal').innerText = `${nutrition.f}g`;
            document.getElementById('headerCal').innerText = `${nutrition.cal} / 2500 KCAL`;
        }

        /* 4. MEDİKAL ANATOMİ & HAREKETLER */
        let isFlipped = false;
        function flipBody(e) {
            if (e.target.classList.contains('hotspot-node')) return;
            isFlipped = !isFlipped;
            document.getElementById('stageCard').classList.toggle('flipped', isFlipped);
        }

        const exercisesDB = {
            chest: {
                title: "Göğüs (Chest) Egzersizleri",
                items: [
                    { name: "Barbell Bench Press", id: "rT7DgCr-3pg", meta: "Bileşik • Güç" },
                    { name: "Incline Dumbbell Press", id: "8iPEnn-ltC8", meta: "Üst Göğüs" },
                    { name: "Cable Fly", id: "Z57CtFmRMxA", meta: "İzolasyon" }
                ]
            },
            shoulders: {
                title: "Omuz (Deltoids) Egzersizleri",
                items: [
                    { name: "Overhead Barbell Press", id: "2yjwXTZQDDI", meta: "Güç" },
                    { name: "Dumbbell Lateral Raise", id: "3VcKaXpzqRo", meta: "Yan Omuz" }
                ]
            },
            biceps: {
                title: "Biceps Egzersizleri",
                items: [
                    { name: "Barbell Biceps Curl", id: "ykJmrZ5v0Oo", meta: "Kütle" },
                    { name: "Hammer Curl", id: "zC3nLlEvin4", meta: "Ön Kol" }
                ]
            },
            triceps: {
                title: "Triceps Egzersizleri",
                items: [
                    { name: "Triceps Pushdown", id: "vB5OHsJ3EME", meta: "İzolasyon" },
                    { name: "Skull Crusher", id: "d_KZxkH_toI", meta: "Kütle" }
                ]
            },
            abs: {
                title: "Karın Egzersizleri",
                items: [{ name: "Hanging Leg Raise", id: "hdng3Nm1x_E", meta: "Alt Karın" }]
            },
            quads: {
                title: "Ön Bacak Egzersizleri",
                items: [
                    { name: "Barbell Back Squat", id: "bEv6CCg2BC8", meta: "Bileşik • Güç" },
                    { name: "Leg Press", id: "IZxyjW7MPJQ", meta: "Hipertrofi" }
                ]
            },
            lats: {
                title: "Sırt / Kanat Egzersizleri",
                items: [
                    { name: "Barbell Row", id: "9efgc2TrvEg", meta: "Kalınlık" },
                    { name: "Lat Pulldown", id: "CAwf7n6Luuc", meta: "Genişlik" }
                ]
            },
            traps: {
                title: "Trapez Egzersizleri",
                items: [{ name: "Barbell Shrug", id: "g6qbq4Du13Q", meta: "Trapez" }]
            },
            hamstrings: {
                title: "Arka Bacak Egzersizleri",
                items: [{ name: "Romanian Deadlift", id: "JCXUYuzwNrM", meta: "Gerilim" }]
            },
            calves: {
                title: "Baldır Egzersizleri",
                items: [{ name: "Standing Calf Raise", id: "-M4-G8p8fmc", meta: "Kalf" }]
            }
        };

        function pickMuscle(key, e) {
            if (e) e.stopPropagation();
            document.querySelectorAll('.hotspot-node').forEach(h => h.classList.remove('active'));
            if (e) e.target.classList.add('active');

            const data = exercisesDB[key];
            if (!data) return;

            document.getElementById('activeMuscleTitle').innerHTML = `<i class="fa-solid fa-fire" style="color:var(--accent);"></i> ${data.title}`;
            const grid = document.getElementById('exerciseGrid');
            grid.innerHTML = '';

            data.items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'exercise-item';
                div.innerHTML = `
                    <div class="name">${item.name}</div>
                    <div class="meta"><span>${item.meta}</span><span><i class="fa-solid fa-play"></i> Video</span></div>
                `;
                div.onclick = () => openVideo(item.name, item.id);
                grid.appendChild(div);
            });
        }

        let pickedName = "";
        function openVideo(name, id) {
            pickedName = name;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1`;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('videoPlayer').src = '';
            document.getElementById('videoModal').style.display = 'none';
        }

        function selectFromModal() {
            document.getElementById('exerciseName').value = pickedName;
            document.getElementById('prQueryInput').value = pickedName;
            closeModal();
        }

        /* 5. ANTRENMAN KAYITLARI */
        async function fetchLogs() {
            const list = document.getElementById('logsList');
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error();
                const logs = await res.json();
                list.innerHTML = '';

                if (!logs || logs.length === 0) {
                    list.innerHTML = '<p style="color:var(--text-muted); font-size:12px; text-align:center; padding:8px 0;">Henüz set kaydedilmedi.</p>';
                    return;
                }

                logs.forEach(log => {
                    const row = document.createElement('div');
                    row.className = 'log-entry';
                    row.innerHTML = `
                        <div>
                            <strong style="font-size:13px; color:#fff;">${log.exerciseName}</strong> &bull; Set ${log.setNumber}
                            <div style="color:var(--accent); font-size:11px; font-weight:700; margin-top:2px;">${log.weight} KG &times; ${log.reps} Tekrar</div>
                        </div>
                        <button onclick="deleteLog(${log.id})" style="background:#241216; border:1px solid #4a1922; color:#ff4d4f; padding:5px 10px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer;">Sil</button>
                    `;
                    list.appendChild(row);
                });
            } catch (err) {
                list.innerHTML = '<p style="color:var(--text-muted); font-size:12px; text-align:center; padding:8px 0;">Henüz set kaydedilmedi.</p>';
            }
        }

        document.getElementById('workoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const setInput = document.getElementById('setNumber');
            const cSet = parseInt(setInput.value) || 1;

            const payload = {
                exerciseName: document.getElementById('exerciseName').value,
                weight: parseFloat(document.getElementById('weight').value),
                reps: parseInt(document.getElementById('reps').value),
                setNumber: cSet
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('weight').value = '';
                document.getElementById('reps').value = '';
                setInput.value = cSet + 1;
                fetchLogs();
            } catch (err) {
                alert("Kayıt eklenemedi.");
            }
        });

        async function deleteLog(id) {
            try {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchLogs();
            } catch (err) { }
        }

        window.onload = () => {
            updateStepDisplay();
            renderFoods();
            pickMuscle('chest');
            fetchLogs();
        };
    </script>
</body>
